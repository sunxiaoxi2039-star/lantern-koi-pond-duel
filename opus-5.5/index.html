<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lantern Koi Pond</title>
<meta name="description" content="A top-down Chinese garden pond at night with GPU ripples, stone lanterns, a weeping willow, koi, a turtle and tree frogs, plus GLB and sprite-sheet export.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<style>
:root{--glass:rgba(16,22,32,.44);--line:rgba(255,255,255,.14);--ink:#eef1ea;--mute:#a7b3ae;--warm:#ffb35c;--jade:#8ad8c2;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05070d;color:var(--ink);font-family:'Nunito Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 10px 34px rgba(0,0,0,.34)}
#hud{position:fixed;left:16px;top:16px;padding:12px 16px 12px;border-radius:var(--r);width:300px;max-width:calc(100vw - 32px);user-select:none}
#hud h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:24px;line-height:1.1;margin:0;letter-spacing:.2px}
#hud .sub{font-size:13px;color:var(--mute);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#counter{color:var(--ink);font-weight:700}
#cap{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--mute)}
#cap.full{color:#ffd2a0;border-color:var(--warm)}
#timeRow{margin-top:10px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:11px;color:var(--mute)}
#timeLabel{font-size:12px;color:var(--ink);margin-top:4px;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:linear-gradient(90deg,#ff9a55,#8f6a9a 50%,#2c4a86);outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#f7efe0;border:2px solid rgba(0,0,0,.35);box-shadow:0 0 10px rgba(255,200,140,.6);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#f7efe0;border:2px solid rgba(0,0,0,.35);cursor:pointer}
#toolbar{position:fixed;right:16px;top:16px;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;padding:8px;border-radius:var(--r);max-width:min(560px,calc(100vw - 350px))}
.btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:600 13px 'Nunito Sans',sans-serif;padding:7px 10px;border-radius:11px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(255,255,255,.13)}
.btn.on{background:rgba(255,179,92,.2);border-color:rgba(255,179,92,.62)}
.btn kbd{font:700 10px 'Nunito Sans',sans-serif;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 4px}
.wind{display:inline-flex;align-items:center;gap:4px}
#windDial{width:31px;height:31px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.28);position:relative;cursor:grab;touch-action:none;flex:none}
#windDial i{position:absolute;left:50%;top:50%;width:2px;height:12px;margin-left:-1px;background:var(--jade);transform-origin:50% 0;border-radius:2px;transition:opacity .2s}
#windDial i::after{content:'';position:absolute;left:-3px;bottom:-5px;border:4px solid transparent;border-top:6px solid var(--jade)}
#windDial.off i{opacity:.35}
#dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;padding:10px;border-radius:20px;max-width:calc(100vw - 24px)}
.card{position:relative;width:108px;flex:none;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);padding:6px 6px 7px;text-align:center;cursor:grab;user-select:none;touch-action:pan-x;transition:transform .15s,background .15s}
.card:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
.card.drag{opacity:.55}
.card canvas.thumb{width:94px;height:94px;display:block;margin:0 auto;border-radius:10px;background:radial-gradient(circle at 50% 40%,rgba(80,120,140,.35),rgba(10,16,26,.2))}
.card .name{font-family:Fraunces,Georgia,serif;font-size:13.5px;margin:4px 0 5px;line-height:1.1}
.card .export{font:700 11px 'Nunito Sans',sans-serif;color:var(--ink);background:rgba(138,216,194,.13);border:1px solid rgba(138,216,194,.4);border-radius:8px;padding:3px 9px;cursor:pointer}
.card .export:hover{background:rgba(138,216,194,.25)}
.menu{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:none;flex-direction:column;gap:4px;padding:6px;border-radius:12px;z-index:5;min-width:118px;background:rgba(14,20,30,.92);border:1px solid var(--line)}
.menu.open{display:flex}
.menu button{font:600 12px 'Nunito Sans',sans-serif;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer;text-align:left}
.menu button:hover{background:rgba(255,179,92,.22)}
#toast{position:fixed;left:50%;bottom:190px;transform:translateX(-50%) translateY(8px);padding:9px 15px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#showUi{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:none;padding:8px 13px;border-radius:20px}
body.noui #hud,body.noui #toolbar,body.noui #dock,body.noui #toast{display:none}
body.noui #showUi{display:inline-flex}
#ghostHint{position:fixed;pointer-events:none;font-size:12px;font-weight:700;padding:4px 9px;border-radius:9px;display:none;transform:translate(-50%,-180%)}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:15px;background:#05070d;z-index:20;line-height:1.5}
@media (max-width:760px){
 #hud{left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));width:auto;padding:10px 12px}
 #hud h1{font-size:19px}
 #toolbar{left:10px;right:10px;top:auto;bottom:calc(150px + env(safe-area-inset-bottom));max-width:none;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 #toolbar::-webkit-scrollbar,#dock::-webkit-scrollbar{display:none}
 .btn{padding:6px 9px;font-size:12px}
 .btn kbd{display:none}
 #dock{left:10px;right:10px;transform:none;bottom:calc(10px + env(safe-area-inset-bottom));overflow-x:auto;padding:8px;gap:6px;scrollbar-width:none}
 .card{width:88px;padding:5px}
 .card canvas.thumb{width:76px;height:76px}
 .card .name{font-size:12px}
 #toast{bottom:205px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud" class="glass">
 <h1>Lantern Koi Pond</h1>
 <div class="sub"><span id="counter">6 koi · 1 turtle · 2 frogs</span><span id="cap">9 / 40</span></div>
 <div id="timeRow"><span>Dusk</span><input id="time" type="range" min="0" max="1000" value="350" aria-label="Time of night"><span>Midnight</span></div>
 <div id="timeLabel">Twilight · 20:10</div>
</div>
<div id="toolbar" class="glass">
 <button class="btn" data-act="rain" title="Rain (R)">Rain <kbd>R</kbd></button>
 <span class="wind"><button class="btn" data-act="wind" title="Wind (W) — drag the dial to set direction">Wind <kbd>W</kbd></button><span id="windDial" class="off" title="Drag to set wind direction and strength"><i></i></span></span>
 <button class="btn" data-act="feed" title="Feed (F)">Feed <kbd>F</kbd></button>
 <button class="btn on" data-act="lanterns" title="Lanterns (L)">Lanterns <kbd>L</kbd></button>
 <button class="btn" data-act="clear" title="Clear pond (C)">Clear pond <kbd>C</kbd></button>
 <button class="btn" data-act="sound" title="Sound (M)">Sound <kbd>M</kbd></button>
 <button class="btn" data-act="hide" title="Hide UI (H)">Hide UI <kbd>H</kbd></button>
</div>
<div id="dock" class="glass">
 <div class="card" data-kind="kohaku"><canvas class="thumb" width="192" height="192"></canvas><div class="name">Kohaku Koi</div><button class="export" type="button">Export</button><div class="menu glass"><button data-fmt="glb">.glb</button><button data-fmt="sprite">Sprite sheet</button></div></div>
 <div class="card" data-kind="showa"><canvas class="thumb" width="192" height="192"></canvas><div class="name">Showa Koi</div><button class="export" type="button">Export</button><div class="menu glass"><button data-fmt="glb">.glb</button><button data-fmt="sprite">Sprite sheet</button></div></div>
 <div class="card" data-kind="butterfly"><canvas class="thumb" width="192" height="192"></canvas><div class="name">Butterfly Koi</div><button class="export" type="button">Export</button><div class="menu glass"><button data-fmt="glb">.glb</button><button data-fmt="sprite">Sprite sheet</button></div></div>
 <div class="card" data-kind="turtle"><canvas class="thumb" width="192" height="192"></canvas><div class="name">Pond Turtle</div><button class="export" type="button">Export</button><div class="menu glass"><button data-fmt="glb">.glb</button><button data-fmt="sprite">Sprite sheet</button></div></div>
 <div class="card" data-kind="frog"><canvas class="thumb" width="192" height="192"></canvas><div class="name">Tree Frog</div><button class="export" type="button">Export</button><div class="menu glass"><button data-fmt="glb">.glb</button><button data-fmt="sprite">Sprite sheet</button></div></div>
</div>
<div id="toast" class="glass"></div>
<div id="ghostHint" class="glass">Release over water</div>
<button id="showUi" class="btn glass" type="button">Show UI <kbd>H</kbd></button>
<div id="err"></div>
<script>
(function(){'use strict';
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
function fail(m){const e=$('#err');e.innerHTML=m;e.style.display='flex';}
if(!window.THREE){fail('Three.js could not be loaded from cdnjs.<br>Check the connection and reload the page.');return;}
const T=THREE;
const TAU=Math.PI*2,DEG=Math.PI/180;
const clamp=(x,a,b)=>x<a?a:x>b?b:x,lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=mulberry(20261017);
const R=(a,b)=>a+(b-a)*rnd(),pick=a=>a[Math.floor(rnd()*a.length)];
const MRR=(a,b)=>a+(b-a)*Math.random();
function hash2(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,o){o=o||4;let s=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*vnoise(x*f+i*17.3,y*f-i*9.1);n+=a;f*=2.03;a*=.5;}return s/n;}
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;}
const isTouch=matchMedia('(pointer:coarse)').matches;

/* ---------- renderer / scene / camera ---------- */
let renderer;
try{renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}catch(e){fail('WebGL is not available in this browser.');return;}
const gl=renderer.getContext();
renderer.autoClear=false;
renderer.localClippingEnabled=true;
const Q={tier:isTouch?1:3,pr:[.75,1,1.25,1.5,2],refr:[.5,.6,.75,.85,1],mask:[256,384,512,768,1024],ff:[20,32,45,58,70],willowEvery:[3,2,1,1,1]};
if(Math.min(screen.width,screen.height)<500)Q.tier=Math.min(Q.tier,1);
renderer.setPixelRatio(Math.min(devicePixelRatio||1,Q.pr[Q.tier]));
renderer.setSize(innerWidth,innerHeight);
$('#app').appendChild(renderer.domElement);
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(40,innerWidth/Math.max(1,innerHeight),1,30);
camera.up.set(0,0,-1);
const CLIP=new T.Plane(new T.Vector3(0,1,0),0),CLIPS=[CLIP];

/* ---------- layout: the camera sees exactly W x H metres of water at y=0 ---------- */
const LY={W:10,H:6,xmin:-5,xmax:5,zmin:-3,zmax:3,aspect:1,camH:8,tx:.03};
function computeLayout(){
 const a=innerWidth/Math.max(1,innerHeight);LY.aspect=a;
 if(a>=1){LY.H=6;LY.W=6*a;}else{LY.W=6;LY.H=6/a;}
 LY.xmin=-LY.W/2;LY.xmax=LY.W/2;LY.zmin=-LY.H/2;LY.zmax=LY.H/2;
 LY.camH=(LY.H/2)/Math.tan(20*DEG);
 camera.aspect=a;camera.position.set(0,LY.camH,0);camera.lookAt(0,0,0);
 camera.near=Math.max(.5,LY.camH-4.5);camera.far=LY.camH+3;camera.updateProjectionMatrix();
 LY.tx=Math.max(LY.W,LY.H)/320;
}
computeLayout();
const NX=sx=>LY.xmin+sx*LY.W,NZ=sy=>LY.zmin+sy*LY.H;
const toN=(x,z)=>[(x-LY.xmin)/LY.W,(z-LY.zmin)/LY.H];
const inView=(x,z,m)=>{m=m||0;return x>LY.xmin+m&&x<LY.xmax-m&&z>LY.zmin+m&&z<LY.zmax-m;};

/* ---------- shared uniforms ---------- */
const U={uTime:{value:0},uUW:{value:0},uSim:{value:null},uSimTx:{value:new T.Vector2(1/320,1/180)},uView:{value:new T.Vector4()},
 uRefr:{value:null},uRes:{value:new T.Vector2(1,1)},uMask:{value:null},uMR:{value:new T.Vector4()},uLDir:{value:new T.Vector3(-.5,.6,-.4)},
 uShallow:{value:new T.Color(0x0f3a36)},uDeep:{value:new T.Color(0x05080f)},uSky:{value:new T.Color()},uMist:{value:new T.Color()},uMistA:{value:.1},
 uMoonCol:{value:new T.Color(0xe4ecff)},uMoonI:{value:1},uMoonP:{value:new T.Vector2()},uLant:{value:[new T.Vector4(),new T.Vector4(),new T.Vector4()]},
 uLantCol:{value:new T.Color(0xff9a3c)},uNight:{value:.35},uWind:{value:new T.Vector2(1,0)},uWindS:{value:0},uMaxD:{value:1.25},uDepth:{value:null},
 uAbs:{value:1.75},uCam:{value:new T.Vector3()},uRain:{value:0},uAmb:{value:new T.Color()},uMoonLt:{value:new T.Color()},uFire:{value:1},uPR:{value:1}};
function setView(){U.uView.value.set(LY.xmin,LY.zmax,LY.W,LY.H);U.uCam.value.copy(camera.position);}
setView();
const GLSL_COMMON=`
uniform float uUW;uniform vec3 uShallow;uniform vec3 uDeep;uniform float uMaxD;uniform float uAbs;uniform float uTime;
vec3 waterTint(float d){return mix(uShallow,uDeep,smoothstep(0.05,1.0,d/uMaxD));}
`;
const GLSL_MASK=`
uniform sampler2D uMask;uniform vec4 uMR;uniform vec3 uLDir;
vec4 maskAt(vec3 p){vec2 q=p.xz-uLDir.xz/max(uLDir.y,0.08)*p.y;vec2 m=vec2((q.x-uMR.x)/uMR.z,(uMR.y-q.y)/uMR.w);
 if(m.x<0.0||m.y<0.0||m.x>1.0||m.y>1.0)return vec4(1.0);
 vec2 o=vec2(0.0017,0.0029);return 0.25*(texture2D(uMask,m+o)+texture2D(uMask,m-o)+texture2D(uMask,m+vec2(-o.y,o.x))+texture2D(uMask,m+vec2(o.y,-o.x)));}
`;
/* patch a built-in material: world position varying, optional vertex code, willow/caster shadow, underwater absorption */
function patchMat(mat,tag,o){
 o=o||{};
 mat.customProgramCacheKey=()=>'lk-'+tag;
 if(o.clip)mat.clippingPlanes=CLIPS;
 mat.onBeforeCompile=sh=>{
  Object.assign(sh.uniforms,{uUW:U.uUW,uShallow:U.uShallow,uDeep:U.uDeep,uMaxD:U.uMaxD,uAbs:U.uAbs,uMask:U.uMask,uMR:U.uMR,uLDir:U.uLDir,uTime:U.uTime},o.uniforms||{});
  let v=sh.vertexShader,f=sh.fragmentShader;
  v=v.replace('#include <common>','#include <common>\nvarying vec3 vLkW;\n'+(o.vHead||''));
  if(o.vNormal)v=v.replace('#include <beginnormal_vertex>','#include <beginnormal_vertex>\n'+o.vNormal);
  if(o.vBegin)v=v.replace('#include <begin_vertex>','#include <begin_vertex>\n'+o.vBegin);
  if(o.vUv)v=v.replace('#include <uv_vertex>','#include <uv_vertex>\n'+o.vUv);
  v=v.replace('#include <project_vertex>','#include <project_vertex>\nvec4 lkW=vec4(transformed,1.0);\n#ifdef USE_INSTANCING\nlkW=instanceMatrix*lkW;\n#endif\nlkW=modelMatrix*lkW;vLkW=lkW.xyz;');
  f=f.replace('#include <common>','#include <common>\nvarying vec3 vLkW;\n'+GLSL_COMMON+GLSL_MASK+(o.fHead||''));
  if(o.fMap)f=f.replace('#include <map_fragment>','#include <map_fragment>\n'+o.fMap);
  f=f.replace('#include <tonemapping_fragment>',(o.fEnd||'')+
   (o.mask?`{vec4 mk=maskAt(vLkW);gl_FragColor.rgb*=uUW<0.5?mix(0.5,1.0,mk.${o.mask}):1.0;}`:'')+
   (o.uw!==false?`if(uUW>0.5){float lkD=max(-vLkW.y,0.0);gl_FragColor.rgb=mix(waterTint(lkD),gl_FragColor.rgb,exp(-lkD*uAbs));}`:'')+
   '\n#include <tonemapping_fragment>');
  sh.vertexShader=v;sh.fragmentShader=f;
 };
 return mat;
}

/* ---------- lights ---------- */
const hemi=new T.HemisphereLight(0xffb27a,0x2a1e1a,.55);hemi.layers.enableAll();scene.add(hemi);
const dirL=new T.DirectionalLight(0xffd6a8,.6);dirL.layers.enableAll();scene.add(dirL);

/* ---------- pointer <-> world ---------- */
const _ray=new T.Raycaster(),_ndc=new T.Vector2(),_pl=new T.Plane(new T.Vector3(0,1,0),0),_pv=new T.Vector3();
function s2w(cx,cy,h,out){out=out||new T.Vector3();_ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);_ray.setFromCamera(_ndc,camera);_pl.constant=-(h||0);if(!_ray.ray.intersectPlane(_pl,out))out.set(0,h||0,0);return out;}
function w2s(x,y,z){_pv.set(x,y,z).project(camera);return[(_pv.x+1)/2*innerWidth,(1-_pv.y)/2*innerHeight];}

/* ---------- helpers ---------- */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function canvasTex(c,rep){const t=new T.CanvasTexture(c);if(rep)t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());return t;}
function setAttr1(g,name,val){const n=g.attributes.position.count,a=new Float32Array(n);a.fill(val);g.setAttribute(name,new T.BufferAttribute(a,1));return g;}
function setAttrN(g,name,vals){const n=g.attributes.position.count,k=vals.length,a=new Float32Array(n*k);for(let i=0;i<n;i++)for(let j=0;j<k;j++)a[i*k+j]=vals[j];g.setAttribute(name,new T.BufferAttribute(a,k));return g;}
function vcolor(g,c){c=new T.Color(c);return setAttrN(g,'color',[c.r,c.g,c.b]);}
/* merge geometries (already transformed); missing attributes are zero-filled (colour: white) */
function mergeGeos(list,attrs){
 attrs=attrs||['position','normal','uv'];
 let nv=0,ni=0;for(const g of list){const n=g.attributes.position.count;nv+=n;ni+=g.index?g.index.count:n;}
 const out=new T.BufferGeometry(),arrs={};
 for(const a of attrs){let it=1;for(const g of list)if(g.attributes[a]){it=g.attributes[a].itemSize;break;}arrs[a]={it,arr:new Float32Array(nv*it)};}
 const idx=new(nv>65535?Uint32Array:Uint16Array)(ni);let vo=0,io=0;
 for(const g of list){
  const n=g.attributes.position.count;
  for(const a of attrs){const A=arrs[a],src=g.attributes[a];if(src)A.arr.set(src.array.subarray(0,n*A.it),vo*A.it);else if(a==='color')A.arr.fill(1,vo*A.it,(vo+n)*A.it);}
  if(g.index){const ia=g.index.array;for(let i=0;i<g.index.count;i++)idx[io++]=ia[i]+vo;}else for(let i=0;i<n;i++)idx[io++]=vo+i;
  vo+=n;
 }
 for(const a of attrs)out.setAttribute(a,new T.BufferAttribute(arrs[a].arr,arrs[a].it));
 out.setIndex(new T.BufferAttribute(idx,1));

  const s=w2s(c.x,Math.max(c.y,-.4),c.z),d=Math.hypot(s[0]-px,s[1]-py)-(c.type==='koi'?.2:c.type==='turtle'?.15:.06)*ppm;

  if(!koiOK(c.x,c.z,.2,.2)){const p=randWater(.35,2,.5);c.x=p[0];c.z=p[1];}c.food=null;koiTarget(c);}

}

function koiTarget(c){

 if(c.y>-.18)addDrop(c.x-Math.cos(c.hd)*.2,c.z+Math.sin(c.hd)*.2,.09,-.025);

function koiEnter(c,k,leap){
 c.mode='swim';c.arc=null;c.y=-.03;c.vyF=-1;c.spd=.55;c.pitch=-.5;c.burst=0;c.food=null;
 c.flee=.7;c.fx=Math.cos(c.hd);c.fz=-Math.sin(c.hd);
 splash(c.x,c.z,(k||.85)*c.sc);startleAt(c.x,c.z,leap?1.1:1.5,c);koiTarget(c);

function koiSwim(c,dt){
 const sp=KOI_SP[c.kind],hl=sp.L*c.sc*.5,fx0=Math.cos(c.hd),fz0=-Math.sin(c.hd);
 let gx=c.tx,gz=c.tz,gy=c.ty,want=.17*c.pace,feeding=false,maxTurn=1.5;
 if(c.burst>0)c.burst-=dt;
 if(c.flee>0){c.flee-=dt;gx=c.x+c.fx*3;gz=c.z+c.fz*3;gy=-.38;want=.5+.5*Math.min(1,c.flee);maxTurn=c.burst>0?9:3.5;if(c.flee<=0)koiTarget(c);}
 else{
  if((c.think-=dt)<=0){c.think=MRR(.25,.45);c.food=foodNear(c.x+fx0*hl,c.z+fz0*hl,3.5);}
  if(c.food&&c.food.age>c.food.life)c.food=null;
  if(c.food){feeding=true;gx=c.food.x;gz=c.food.z;gy=-.035;want=.34*c.pace;maxTurn=2.6;}
  else if(Math.hypot(c.tx-c.x,c.tz-c.z)<.4||(c.wt-=dt)<=0)koiTarget(c);
 }
 const mx=c.x+fx0*hl,mz=c.z+fz0*hl,dx=gx-(feeding?mx:c.x),dz=gz-(feeding?mz:c.z),dist=Math.hypot(dx,dz);
 let wh=Math.atan2(-dz,dx);
 let sx=0,sz=0;
 for(const o of CRE){if(o===c||o.type!=='koi'||o.mode!=='swim')continue;const ex=c.x-o.x,ez=c.z-o.z,d2=ex*ex+ez*ez;
  if(d2<.16&&d2>1e-6&&Math.abs(c.y-o.y)<.18){const d=Math.sqrt(d2),s=(.4-d)/.4;sx+=ex/d*s;sz+=ez/d*s;}}
 if(sx||sz){const w=feeding?.5:1.1,vx=Math.cos(wh)+sx*w,vz=-Math.sin(wh)+sz*w;wh=Math.atan2(-vz,vx);}
 const la=Math.min(.35+hl*1.6,feeding?Math.max(dist,.15)+.1:9),m=feeding?.1:.26,dm=feeding?.12:.24;
 if(!koiOK(c.x+Math.cos(wh)*la,c.z-Math.sin(wh)*la,m,dm)){
  let nh=null;const side=angDiff(c.hd,wh)>=0?1:-1;
  for(const o of[.45,.9,1.4,1.9,2.5,3.1]){for(const s of[side,-side]){const h=wh+o*s;if(koiOK(c.x+Math.cos(h)*la,c.z-Math.sin(h)*la,m,dm)){nh=h;break;}}if(nh!==null)break;}
  if(nh!==null)wh=nh;else{const g=sdGrad(c.x,c.z);wh=Math.atan2(-g[1],g[0]);}
 }
 const dh=angDiff(c.hd,wh),tr=clamp(dh*(c.burst>0?14:2.4),-maxTurn,maxTurn);
 c.turn+=(tr-c.turn)*Math.min(1,dt*(c.burst>0?20:5));c.hd+=c.turn*dt;
 if(feeding&&dist<.25)want*=.45+dist*2.2;
 want*=1-.45*Math.min(1,Math.abs(dh)/2.2);
 c.spd+=(want-c.spd)*Math.min(1,dt*(c.flee>0?5:1.4));
 const fx=Math.cos(c.hd),fz=-Math.sin(c.hd);
 let nx=c.x+fx*c.spd*dt,nz=c.z+fz*c.spd*dt;
 if(sdAt(nx,nz)<.06||!inView(nx,nz,.06)){c.spd*=.6;nx=c.x;nz=c.z;const g=sdGrad(c.x,c.z);c.turn+=clamp(angDiff(c.hd,Math.atan2(-g[1],g[0])),-1,1)*dt*20;}
 c.x=nx;c.z=nz;
 const floor=-Math.max(depthAt(c.x,c.z),.05)+.07*c.sc,ty=Math.max(gy,floor),vy=clamp((ty-c.y)*1.4,-.22,.22)+c.vyF;
 c.vyF*=Math.exp(-3*dt);c.y=Math.min(-.025,Math.max(c.y+vy*dt,floor));
 c.pitch+=(clamp(Math.atan2(vy,Math.max(c.spd,.08))*.8+(feeding&&dist<.35?.28:0),-.6,.6)-c.pitch)*Math.min(1,dt*3);
 c.roll+=(clamp(-c.turn*.09,-.35,.35)-c.roll)*Math.min(1,dt*4);
 let mt=.12+.1*Math.sin(time*2.4+c.br);
 if(feeding){if(dist<.3)mt=.85;
  if(dist<.075&&c.y>-.1){const f=c.food;if(FOOD.list.indexOf(f)>=0){foodEat(f);c.gulp=.3;addDrop(f.x,f.z,.06,.03);spray(f.x,.01,f.z,3,.15,.6,.006);floatPush(f.x,f.z,.12,.05);sfx('gulp',1,f.x);}
   c.food=null;c.think=MRR(.3,.7);}}
 if(c.gulp>0){c.gulp-=dt;mt=1;}
 c.mouth+=(mt-c.mouth)*Math.min(1,dt*12);
 if(c.y>-.13&&c.spd>.09&&(c.wake-=dt)<=0){c.wake=.12+Math.random()*.05;addDrop(c.x-fx*hl*.9,c.z-fz*hl*.9,.08,-.01*(.6+c.spd));if(c.y>-.07)floatPush(c.x,c.z,.1,.04);}
 const s=c.spd,ba=c.burst>0;
 c.ph+=TAU*(.85+s*4.5+(ba?2.5:0))*dt;
 c.amp+=((.03+s*.065+(ba?.06:0))-c.amp)*Math.min(1,dt*6);
 c.bend+=(clamp(-c.turn*.075,-.16,.16)-c.bend)*Math.min(1,dt*10);
 c.famp+=((c.flee>0?.06:lerp(.42,.1,Math.min(1,s/.5)))-c.famp)*Math.min(1,dt*3);

function koiLeap(c){c.mode='rise';c.riseT=0;c.flee=0;c.food=null;}
function koiUpdate(c,dt){
 const sp=KOI_SP[c.kind];
 if(c.mode==='swim')koiSwim(c,dt);
 else if(c.mode==='held'){
  const k=Math.min(1,dt*12),ox=c.x,oz=c.z;c.x+=(c.hx-c.x)*k;c.z+=(c.hz-c.z)*k;c.y+=(.35-c.y)*Math.min(1,dt*6);
  const vx=c.x-ox,vz=c.z-oz;if(vx*vx+vz*vz>1e-6)c.hd+=angDiff(c.hd,Math.atan2(-vz,vx))*Math.min(1,dt*4);
  c.ph+=TAU*2.6*dt;c.amp=.075;c.bend=.05*Math.sin(time*4.3);c.pitch=.12*Math.sin(time*2.7);c.roll=.18*Math.sin(time*1.9);
  c.mouth=.5+.5*Math.sin(time*6);c.famp=.45;c.fph+=TAU*2*dt;c.flp+=TAU*3*dt;
 }
 else if(c.mode==='arc'){
  const done=arcStep(c,dt),a=c.arc,hs=Math.hypot(a.x1-a.x0,a.z1-a.z0)/a.dur;
  c.pitch=clamp(Math.atan2(a.vy,Math.max(hs,.3)),-1.1,1.1)*.8;c.ph+=TAU*3*dt;c.amp=.07;c.roll+=(.3*Math.sin(time*5)-c.roll)*Math.min(1,dt*4);
  c.fph+=TAU*2*dt;c.flp+=TAU*3*dt;
  if(done)koiEnter(c,a.dur<.5?.6:.85);
 }
 else if(c.mode==='rise'){
  c.riseT+=dt;const fx=Math.cos(c.hd),fz=-Math.sin(c.hd);
  c.spd+=(1.3-c.spd)*Math.min(1,dt*4);c.pitch+=(.75-c.pitch)*Math.min(1,dt*5);
  const h=c.spd*Math.cos(c.pitch)*dt;c.x+=fx*h;c.z+=fz*h;c.y+=c.spd*Math.sin(c.pitch)*dt;
  c.ph+=TAU*5*dt;c.amp=.08;c.bend*=.9;c.turn*=.9;c.fph+=TAU*dt;c.flp+=TAU*4*dt;
  if(c.y>=-.03||c.riseT>1.5||!isWater(c.x,c.z,.2)){c.mode='air';c.vx=fx*1.05;c.vz=fz*1.05;c.vy=2.5+Math.random()*.5;c.y=Math.max(c.y,-.03);splash(c.x+fx*.1,c.z+fz*.1,.45);}
 }
 else if(c.mode==='air'){
  c.vy-=9.8*dt;c.x+=c.vx*dt;c.z+=c.vz*dt;c.y+=c.vy*dt;
  c.pitch=Math.atan2(c.vy,Math.hypot(c.vx,c.vz))*.9;c.ph+=TAU*3.2*dt;c.amp=.06;c.roll+=(.25*Math.sin(time*3)-c.roll)*Math.min(1,dt*3);c.flp+=TAU*4*dt;
  if(c.y<=0&&c.vy<0){if(isWater(c.x,c.z,.02))koiEnter(c,.95,true);else{c.mode='swim';c.y=-.1;const p=randWater(.35,2,.5);c.x=p[0];c.z=p[1];}}
 }
 blobAdd(c.x,c.y,c.z,sp.L*c.sc*.95,sp.L*c.sc*.3,c.hd,.85);
}
function koiWrite(){
 for(const k in KOI_IM)KOI_IM[k].n=0;
 for(const c of CRE){if(c.type!=='koi')continue;const M=KOI_IM[c.kind];if(!M||M.n>=M.cap)continue;const i=M.n++;
  _7e.set(c.roll,c.hd,c.pitch,'YZX');_7q.setFromEuler(_7e);_7p.set(c.x,c.y,c.z);_7s.setScalar(c.sc);_7m.compose(_7p,_7q,_7s);
  M.body.setMatrixAt(i,_7m);M.aSw.setXYZW(i,c.ph,c.amp,c.bend,c.mouth);M.aFi.setXYZW(i,c.fph,c.famp,c.flp,c.var);}
 for(const k in KOI_IM){const M=KOI_IM[k];M.body.count=M.fin.count=M.n;M.body.instanceMatrix.needsUpdate=true;M.aSw.needsUpdate=true;M.aFi.needsUpdate=true;}
}
let leapT=MRR(12,20);
function updateCreatures(dt){
 for(let i=CRE.length-1;i>=0;i--){const c=CRE[i];if(!c)continue;if(c.type==='koi')koiUpdate(c,dt);else if(c.type==='turtle')turtleUpdate(c,dt);else frogUpdate(c,dt);}
 if((leapT-=dt)<=0){leapT=MRR(25,40);
  const L=CRE.filter(c=>c.type==='koi'&&c.mode==='swim'&&c.flee<=0&&!c.food&&depthAt(c.x,c.z)>.4&&sdAt(c.x,c.z)>.6);
  if(L.length){const c=L[(Math.random()*L.length)|0],fx=Math.cos(c.hd),fz=-Math.sin(c.hd),lx=c.x+fx*.85,lz=c.z+fz*.85;
   if(koiOK(lx,lz,.4,.3)&&!padAt(lx,lz,1.15)&&!padAt(c.x+fx*.1,c.z+fz*.1,1.15))koiLeap(c);else leapT=3;}
  else leapT=4;}

/* =================== pond turtle: model, scute texture, paddling, basking =================== */
const TUR={g:null,m:null,tex:null};
function mirrorZ(g){const m=g.clone();m.scale(1,1,-1);const ix=m.index.array;for(let i=0;i<ix.length;i+=3){const t=ix[i+1];ix[i+1]=ix[i+2];ix[i+2]=t;}m.computeVertexNormals();return m;}
function turtleShellTex(){
 const S=256,c=mkCanvas(S,S),x=c.getContext('2d'),img=x.createImageData(S,S),d=img.data,r=mulberry(4242),seeds=[];
 const add=(px,py,t)=>seeds.push([px,py,t,.85+r()*.3,r()]);
 for(let k=0;k<5;k++)add(60+k*34,128,0);
 for(const sd of[-1,1])for(let k=0;k<4;k++)add(77+k*34,128+sd*(k===0||k===3?46:52),1);
 for(let k=0;k<22;k++){const a=k/22*TAU+.07;add(128+116*Math.cos(a),128+116*Math.sin(a),2);}
 for(let py=0;py<S;py++)for(let px=0;px<S;px++){
  let d1=1e9,d2=1e9,b=seeds[0];
  for(const s of seeds){const dx=px-s[0],dy=py-s[1],q=dx*dx+dy*dy;if(q<d1){d2=d1;d1=q;b=s;}else if(q<d2)d2=q;}
  const r1=Math.sqrt(d1),e=Math.sqrt(d2)-r1,i=(py*S+px)*4,nx=(px-128)/128,ny=(py-128)/128,rr=Math.sqrt(nx*nx+ny*ny);
  const k=b[3]*(b[2]===2?.82:1)*(1-.2*rr),ring=.5+.5*Math.cos(r1*.85);
  let R1=78*k+ring*8,G1=74*k+ring*7,B1=44*k+ring*3;
  if(b[2]===1&&Math.sin(px*.13+py*.05+b[4]*9)>.92){R1+=42;G1+=36;B1+=8;}
  if(b[2]===2&&Math.sin(Math.atan2(ny,nx)*44)>.75){R1+=26;G1+=22;B1+=6;}
  const sm=e<2.4?1:e<6?1-(e-2.4)/3.6:0;
  d[i]=lerp(R1,43,sm);d[i+1]=lerp(G1,39,sm);d[i+2]=lerp(B1,23,sm);d[i+3]=255;
 }
 x.putImageData(img,0,0);return c;
}
function turtleParts(){
 if(TUR.g)return TUR;
 /* carapace: polar grid with a flattened dome profile, rim band, planar top-down UV */
 const nR=8,nA=24,RX=.15,RZ=.12,pos=[],uv=[],idx=[];
 for(let i=0;i<=nR+1;i++){const r=i>nR?1:Math.pow(i/nR,.85);
  for(let j=0;j<=nA;j++){const a=j/nA*TAU,x=Math.cos(a)*r*RX,z=Math.sin(a)*r*RZ;
   const y=i>nR?-.006:(.07*Math.pow(Math.max(0,1-Math.pow(r,2.4)),.55)+.004)*(1-.07*x/RX);
   pos.push(x,y,z);uv.push(.5+x/(2*RX),.5-z/(2*RZ));}}
 for(let i=0;i<=nR;i++)for(let j=0;j<nA;j++){const a=i*(nA+1)+j,b=a+nA+1;idx.push(a,a+1,b,a+1,b+1,b);}
 const shell=new T.BufferGeometry();shell.setAttribute('position',new T.Float32BufferAttribute(pos,3));shell.setAttribute('uv',new T.Float32BufferAttribute(uv,2));shell.setIndex(idx);shell.computeVertexNormals();
 const belly=new T.SphereGeometry(1,18,4,0,TAU,Math.PI/2,Math.PI/2);belly.scale(.146,.022,.116);vcolor(belly,0xc4ad64);
 const tail=new T.ConeGeometry(.012,.05,6);tail.rotateZ(Math.PI/2);tail.translate(-.165,.002,0);vcolor(tail,0x4f5c33);
 const body=mergeGeos([belly,tail],['position','normal','uv','color']);
 /* head + neck in head-pivot space (pivot at the shell opening, +x outward) */
 const neck=new T.CylinderGeometry(.021,.025,.06,8,1,true);neck.rotateZ(Math.PI/2);neck.translate(.03,0,0);vcolor(neck,0x55633a);
 const hd=new T.SphereGeometry(.03,10,8);hd.scale(1.4,.82,.92);hd.translate(.075,.004,0);vcolor(hd,0x5b6a3a);
 const hp=[neck,hd];
 for(const sd of[1,-1]){const e=new T.SphereGeometry(.0065,6,4);e.translate(.09,.014,sd*.019);vcolor(e,0x0d0d0d);hp.push(e);
  const er=new T.SphereGeometry(.011,8,6);er.scale(1.3,.7,.35);er.translate(.06,.008,sd*.024);vcolor(er,0xb8342a);hp.push(er);}
 const head=mergeGeos(hp,['position','normal','uv','color']);
 /* paddle limbs, root at the pivot, pointing outward (+z = right side) */
 const limb=(fwd)=>{const g=new T.SphereGeometry(1,8,6);g.scale(.022,.011,.045);g.translate(0,0,.038);g.rotateY(fwd);vcolor(g,0x4f5c33);return g;};
 const fR=limb(-.5),hR=limb(.65);

  skin:patchMat(new T.MeshStandardMaterial({vertexColors:true,roughness:.72}),'turSkin',{clip:true})};
 return TUR;
}
const TUR_LIMBS=[['fR',.075,.095,1,1],['fL',.075,-.095,-1,1],['hR',-.085,.085,1,0],['hL',-.085,-.085,-1,0]];
function turtleModel(){
 const P=turtleParts(),root=new T.Group();

 const head=new T.Group();head.position.set(.11,.016,0);head.add(new T.Mesh(P.g.head,P.m.skin));root.add(head);
 const limbs=[];for(const[k,x,z,sd,front]of TUR_LIMBS){const pv=new T.Group();pv.position.set(x,.004,z);pv.add(new T.Mesh(P.g[k],P.m.skin));root.add(pv);limbs.push({pv,sd,front});}
 return{root,head,limbs};
}
/* pose: ph = gait phase, paddle = stroke amount, head 0 (in) .. 1 (out), hp = head pitch, look = head yaw, splay = basking spread */
function turtlePose(M,ph,paddle,head,hp,look,splay){
 M.head.position.x=lerp(.052,.11,head);M.head.rotation.set(0,look||0,(hp||0)+.05*Math.sin(ph)*paddle);

  L.pv.rotation.set(L.sd*.25*Math.cos(ph+off)*paddle,L.sd*((L.front?.55:.4)*s*paddle+(splay||0)*(L.front?-.2:.2)),0);
  L.pv.scale.setScalar(ls);}
}

/* one voice: gain -> stereo pan (from world x) -> sfx bus; freed after dur */

  if(k>.12)auTone(o,t+.012,.17,380+220*Math.random(),105,.55*Math.min(1,k+.25));

  auTone(o,t,.1,800*MRR(.8,1.25),240,.75);auTick(o,t+.004,.35);},

  auTone(o,t,.13,185*MRR(.9,1.15),88,.9);auNoise(o,t,.05,'lowpass',1300,300,1,.002);auTone(o,t+.07,.05,520,900,.18);},
 drip(k,x,t){if(auRL('drip',.08))return;const o=auOut(x,.22*clamp(k,.1,1),.2);if(o)auTone(o,t,.08,1100*MRR(.85,1.2),2300,.6);},
 whoosh(k,x,t){if(auRL('whoosh',.1))return;const o=auOut(x,.13*clamp(k,.2,1),.6);if(o)auNoise(o,t,.42,'bandpass',320,2300,1.3,.14);},

/* =================== card thumbnails, 8-frame sprite sheets and .glb export, all from the live 3D models =================== */
/* file names come from SLUG(kind): kohaku-koi, showa-koi, butterfly-koi, pond-turtle, tree-frog */
const PV={scene:null,ortho:null,persp:null,rt:null,N:512};
const _pvV=new T.Vector3();
function pvInit(){
 if(PV.scene)return PV;
 const s=new T.Scene();
 /* same light set as the pond (1 hemisphere, 1 directional, 3 point lights) so the patched shaders are reused, not recompiled */
 const h=new T.HemisphereLight(0xe6eeff,0x3b3328,.5),d=new T.DirectionalLight(0xfff0dc,.62);d.position.set(-1.6,4,-1.1);s.add(h,d);
 for(let i=0;i<3;i++){const p=new T.PointLight(0xff9a3c,0,4,2);p.position.set(0,-40,0);s.add(p);}
 PV.scene=s;PV.ortho=new T.OrthographicCamera(-1,1,1,-1,.1,10);PV.persp=new T.PerspectiveCamera(26,1,.05,20);
 PV.rt=new T.WebGLRenderTarget(PV.N,PV.N,{format:T.RGBAFormat,type:T.UnsignedByteType,minFilter:T.LinearFilter,magFilter:T.LinearFilter,depthBuffer:true,stencilBuffer:false});
 return PV;
}
/* render the preview scene into the 512px target and read it back as straight-alpha, top-down rows */
function pvRender(cam){
 const r=renderer,prev=r.getRenderTarget(),cc=new T.Color();r.getClearColor(cc);const ca=r.getClearAlpha();
 const cn=CLIP.normal.clone(),c0=CLIP.constant,uw=U.uUW.value;
 CLIP.normal.set(0,1,0);CLIP.constant=1e4;U.uUW.value=0;
 const N=PV.N,buf=new Uint8Array(N*N*4);
 try{r.setRenderTarget(PV.rt);r.setClearColor(0x000000,0);r.clear(true,true,false);r.render(PV.scene,cam);r.readRenderTargetPixels(PV.rt,0,0,N,N,buf);}
 finally{r.setRenderTarget(prev);r.setClearColor(cc,ca);CLIP.normal.copy(cn);CLIP.constant=c0;U.uUW.value=uw;}
 const img=new ImageData(N,N),d=img.data,row=N*4;
 for(let y=0;y<N;y++){const s=(N-1-y)*row,o=y*row;
  for(let x=0;x<row;x+=4){const a=buf[s+x+3];d[o+x+3]=a;
   if(a>0&&a<255){const k=255/a;d[o+x]=Math.min(255,buf[s+x]*k);d[o+x+1]=Math.min(255,buf[s+x+1]*k);d[o+x+2]=Math.min(255,buf[s+x+2]*k);}
   else{d[o+x]=buf[s+x];d[o+x+1]=buf[s+x+1];d[o+x+2]=buf[s+x+2];}}}
 const c=mkCanvas(N,N);c.getContext('2d').putImageData(img,0,0);return c;
}
/* a preview copy of a creature: pose(u) = swim cycle 0..1, rest() = card pose */
function pvMake(kind){
 if(isKoi(kind)){
  const M=koiIM(kind,1),root=new T.Group();M.body.count=M.fin.count=1;M.body.setMatrixAt(0,new T.Matrix4());M.body.instanceMatrix.needsUpdate=true;root.add(M.body,M.fin);
  const set=(ph,amp,bend,fph,flp)=>{M.aSw.setXYZW(0,ph,amp,bend,0);M.aFi.setXYZW(0,fph,.3,flp,0);M.aSw.needsUpdate=true;M.aFi.needsUpdate=true;};
  return{root,pose:u=>{const p=u*TAU;set(p,.065,0,p,p*2);},rest:()=>set(1.1,.045,.04,.6,1.3),margin:.08,
   dispose(){M.body.geometry.dispose();M.fin.geometry.dispose();for(const m of[M.body,M.fin])if(typeof m.dispose==='function')m.dispose();}};
 }
 if(kind==='turtle'){const M=turtleModel(),root=new T.Group();root.add(M.root);
  return{root,pose:u=>turtlePose(M,u*TAU,1,1,0,0,0),rest:()=>turtlePose(M,.9,.45,1,-.05,.15,.2),dispose(){},margin:.02};}
 const M=frogModel(true),root=new T.Group();root.add(M.root);
 return{root,pose:u=>{const e=u<.22?smooth(0,.22,u):1-smooth(.22,1,u);frogPose(M,e,.1,1,0);},rest:()=>frogPose(M,0,.45,0,0),dispose(){},margin:.01};
}
function renderThumbs(){
 pvInit();
 for(const cv of $$('.card canvas.thumb')){
  const kind=cv.closest('.card').dataset.kind,P=pvMake(kind),root=P.root;
  P.rest();root.rotation.set(0,.5,0);PV.scene.add(root);root.updateMatrixWorld(true);
  const sph=new T.Box3().expandByObject(root).getBoundingSphere(new T.Sphere()),cam=PV.persp,dist=sph.radius/Math.sin(cam.fov*DEG/2)*.9;
  cam.position.copy(sph.center).addScaledVector(_pvV.set(.3,.82,.52).normalize(),dist);cam.up.set(0,1,0);cam.lookAt(sph.center);
  cam.near=dist*.2;cam.far=dist*3;cam.updateProjectionMatrix();
  const src=pvRender(cam),x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);x.imageSmoothingQuality='high';x.drawImage(src,0,0,PV.N,PV.N,0,0,cv.width,cv.height);
  PV.scene.remove(root);P.dispose();
 }
}
function saveBlob(blob,name){
 const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();
 setTimeout(()=>{a.remove();URL.revokeObjectURL(u);},4000);
}
/* sprite sheet: 8 top-down 256x256 frames of one swim cycle, transparent, head up, one 2048x256 PNG */
function exportSprite(kind){
 pvInit();const P=pvMake(kind),root=P.root;root.rotation.set(0,Math.PI/2,0);PV.scene.add(root);
 try{
  const box=new T.Box3();for(let i=0;i<8;i++){P.pose(i/8);root.updateMatrixWorld(true);box.expandByObject(root);}
  const c=box.getCenter(new T.Vector3()),sz=box.getSize(new T.Vector3()),s=(Math.max(sz.x,sz.z)/2+P.margin)*1.15,cam=PV.ortho;
  cam.left=-s;cam.right=s;cam.top=s;cam.bottom=-s;cam.near=.1;cam.far=10;cam.position.set(c.x,5,c.z);cam.up.set(0,0,-1);cam.lookAt(c.x,0,c.z);cam.updateProjectionMatrix();
  const sheet=mkCanvas(2048,256),sx=sheet.getContext('2d');sx.imageSmoothingQuality='high';
  for(let i=0;i<8;i++){P.pose(i/8);sx.drawImage(pvRender(cam),0,0,PV.N,PV.N,i*256,0,256,256);}
  const name=SLUG(kind)+'_swim_8f.png';
  sheet.toBlob(b=>{if(!b){toast('Could not encode the PNG');return;}saveBlob(b,name);toast(`Saved ${name} · 8 frames · 2048×256`);},'image/png');
 }finally{PV.scene.remove(root);P.dispose();}
}
/* ---------- .glb: rest pose, Y-up, metres (real size), origin at the body centre, head along +Z ---------- */
const s2l=v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);
function cleanGeo(g,vc){
 const A=g.attributes,n=A.position.count,o=new T.BufferGeometry();
 o.setAttribute('position',new T.Float32BufferAttribute(Array.from(A.position.array.subarray(0,n*3)),3));
 if(A.normal)o.setAttribute('normal',new T.Float32BufferAttribute(Array.from(A.normal.array.subarray(0,n*3)),3));else o.computeVertexNormals();
 o.setAttribute('uv',A.uv?new T.Float32BufferAttribute(Array.from(A.uv.array.subarray(0,n*2)),2):new T.Float32BufferAttribute(new Float32Array(n*2),2));
 if(vc){const c=new Float32Array(n*3),C=A.color;for(let i=0;i<n;i++){c[i*3]=s2l(C?C.getX(i):1);c[i*3+1]=s2l(C?C.getY(i):1);c[i*3+2]=s2l(C?C.getZ(i):1);}o.setAttribute('color',new T.BufferAttribute(c,3));}
 if(g.index)o.setIndex(Array.from(g.index.array.subarray(0,g.index.count)));
 return o;
}
/* koi pattern for export: one 512x256 variant with the shader's scale pattern baked in */
function koiExportTex(kind,k){
 const W=512,H=256,c=mkCanvas(W,H),x=c.getContext('2d');x.drawImage(koiAtlas(kind),0,k*H,W,H,0,0,W,H);
 const im=x.getImageData(0,0,W,H),d=im.data;
 for(let py=0;py<H;py++){const v=1-(py+.5)/H;for(let px=8;px<W;px++){const u=(px+.5)/W,gx=u*58,gy=v*36+(Math.floor(gx)%2)*.5;
  const fx=gx-Math.floor(gx)-.5,fy=gy-Math.floor(gy)-.5,m=1-.14*smooth(.16,.5,Math.hypot(fx,fy*1.3)),i=(py*W+px)*4;d[i]*=m;d[i+1]*=m;d[i+2]*=m;}}
 x.putImageData(im,0,0);return c;
}
/* the swim shader closes the mouth (scale .45 around its root) when idle: do the same for the exported rest pose */
function koiRestBody(g0){
 const g=g0.clone(),P=g.attributes.position,A=g.attributes.aPart,R=g.attributes.aRoot;
 if(A&&R)for(let i=0;i<P.count;i++)if(A.getX(i)>4.5){P.setY(i,R.getY(i)+(P.getY(i)-R.getY(i))*.45);P.setZ(i,R.getZ(i)+(P.getZ(i)-R.getZ(i))*.45);}
 return g;
}
function glbModel(kind){
 let src,centreOf,mapOver=new Map(),label=new Map(),name=SLUG(kind);
 if(isKoi(kind)){const G=koiGeo(kind),M=koiMats(kind),body=new T.Mesh(koiRestBody(G.body),M.body);src=new T.Group();src.add(body,new T.Mesh(G.fins,M.fin));centreOf=[body];
  mapOver.set(M.body,canvasTex(koiExportTex(kind,0)));label.set(M.body,'skin');label.set(M.fin,'fins');}
 else if(kind==='turtle'){const M=turtleModel();turtlePose(M,0,0,1,0,0,0);src=M.root;centreOf=[src.children[0],src.children[1]];label.set(TUR.m.shell,'shell');label.set(TUR.m.skin,'skin');}
 else{const M=frogModel(true);frogPose(M,0,.15,0,0);src=M.root;centreOf=[src.children[0]];label.set(FROG.m,'skin');}
 src.updateMatrixWorld(true);
 const inv=new T.Matrix4().copy(src.matrixWorld).invert(),byMat=new Map(),cBox=new T.Box3(),all=new T.Box3();
 src.traverseVisible(o=>{if(!o.isMesh)return;const m=new T.Matrix4().multiplyMatrices(inv,o.matrixWorld),g=cleanGeo(o.geometry,!!o.material.vertexColors).applyMatrix4(m);
  g.computeBoundingBox();all.union(g.boundingBox);if(centreOf&&centreOf.includes(o))cBox.union(g.boundingBox);
  if(!byMat.has(o.material))byMat.set(o.material,[]);byMat.get(o.material).push(g);});
 const C=(centreOf?cBox:all).getCenter(new T.Vector3());
 const X=new T.Matrix4().makeRotationY(-Math.PI/2).multiply(new T.Matrix4().makeTranslation(-C.x,-C.y,-C.z));
 const out=new T.Group();out.name=name;let tris=0,part=0;
 for(const[mat,list]of byMat){
  const vc=!!mat.vertexColors,g=mergeGeos(list,vc?['position','normal','uv','color']:['position','normal','uv']).applyMatrix4(X);
  const e=new T.MeshStandardMaterial({color:mat.color.clone().convertSRGBToLinear(),roughness:mat.roughness,metalness:mat.metalness,vertexColors:vc,
   transparent:mat.transparent,opacity:mat.opacity,side:mat.side,map:mapOver.get(mat)||mat.map||null});
  e.name=name+'_'+(label.get(mat)||'part'+part);
  const mesh=new T.Mesh(g,e);mesh.name=name+'_part'+(part++);out.add(mesh);tris+=g.index.count/3;
 }
 return{out,tris};
}
function exportGLB(kind){
 if(!T.GLTFExporter){toast('The glTF exporter did not load: check the connection and reload');return;}
 const{out,tris}=glbModel(kind),name=SLUG(kind)+'.glb';
 if(tris>=5000)console.warn('glb over budget',tris);
 new T.GLTFExporter().parse(out,res=>{
  saveBlob(new Blob([res],{type:'model/gltf-binary'}),name);toast(`Saved ${name} · ${tris|0} triangles · real size, Y-up`);
  out.traverse(o=>{if(o.isMesh)o.geometry.dispose();});
 },{binary:true,onlyVisible:true,truncateDrawRange:true,embedImages:true,forcePowerOfTwoTextures:false});
}

/* =================== time of night, adaptive quality, (re)build, main loop =================== */
const TOD={sky:[0xe08a5a,0x1c2c55],hs:[0xffb27a,0x3b5a8f],hg:[0x2a1e1a,0x05070d],dl:[0xffd6a8,0x9fb8ff],mist:[0x6b4a52,0x1a2740],
 sh:[0x1f4a3e,0x0f3a36],de:[0x121a33,0x03060f],rim:[0xd8a07a,0x8fa6d8],mc:[0xffd2a0,0xe4ecff],fx:[0xffe6cc,0xeaf2ff],
 amb:[[.26,.2,.17],[.07,.09,.15]],ml:[[.75,.55,.38],[.42,.52,.78]]};
for(const k in TOD)TOD[k]=TOD[k].map(v=>Array.isArray(v)?new T.Color(v[0],v[1],v[2]):new T.Color(v));
const _L=new T.Vector3();
function timeLabel(t){
 const m=Math.round(1120+320*t),hh=Math.floor(m/60)%24,mm=m%60,ph=t<.18?'Dusk':t<.5?'Twilight':t<.85?'Night':'Midnight';
 return ph+' · '+String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
function applyTime(t){
 t=clamp(t,0,1);S.time=t;const C=(o,k)=>o.copy(TOD[k][0]).lerp(TOD[k][1],t);
 C(U.uSky.value,'sky');C(hemi.color,'hs');C(hemi.groundColor,'hg');hemi.intensity=lerp(.55,.35,t);
 C(dirL.color,'dl');dirL.intensity=lerp(.6,.42,t);
 C(U.uMist.value,'mist');U.uMistA.value=lerp(.25,.45,t);
 C(U.uShallow.value,'sh');C(U.uDeep.value,'de');C(U.uRim.value,'rim');C(U.uMoonCol.value,'mc');C(FXC,'fx');
 C(U.uAmb.value,'amb');C(U.uMoonLt.value,'ml');
 U.uFire.value=lerp(.6,1,t);U.uMoonI.value=lerp(.35,1,smooth(0,.8,t));U.uNight.value=t;
 const e=(14+36*Math.pow(t,1.5))*DEG;_L.set(-.8*Math.cos(e),Math.sin(e),-.6*Math.cos(e)).normalize();
 U.uLDir.value.copy(_L);dirL.position.copy(_L).multiplyScalar(10);
 const mn=WORLD.moonN||[.4,.33];U.uMoonP.value.set(NX(lerp(mn[0]-.06,mn[0],t)),NZ(lerp(mn[1]-.05,mn[1],t)));
 U.uPR.value=renderer.getPixelRatio();
 const el=$('#timeLabel');if(el)el.textContent=timeLabel(t);
}

/* ---------- adaptive quality: drop a tier when slow, climb back slowly, never oscillate ---------- */
const PERF={avg:16.7,good:0,cool:3,fails:[0,0,0,0,0]};
function setTier(t){
 t=clamp(t,0,4);if(t===Q.tier)return;Q.tier=t;
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,Q.pr[t]));renderer.setSize(innerWidth,innerHeight);
 buildMask();sizeRefr();U.uPR.value=renderer.getPixelRatio();
}
function adaptQuality(ms){
 PERF.avg+=(ms-PERF.avg)*.06;PERF.cool-=ms/1000;if(PERF.cool>0)return;
 if(PERF.avg>24&&Q.tier>0){PERF.fails[Q.tier]++;setTier(Q.tier-1);PERF.cool=2.5;PERF.good=0;PERF.avg=17;}
 else if(PERF.avg<17.6&&Q.tier<4&&PERF.fails[Q.tier+1]<2){PERF.good+=ms/1000;if(PERF.good>4){setTier(Q.tier+1);PERF.cool=3;PERF.good=0;}}
 else PERF.good=0;
}

/* ---------- static world: rebuilt when the window shape changes a lot ---------- */
function buildStatic(){
 if(STATIC){scene.remove(STATIC);STATIC.traverse(o=>{if(o.geometry&&o.geometry!==padG&&o.geometry!==lotusG)o.geometry.dispose();});}
 if(floorTex&&floorTex.dispose)floorTex.dispose();
 STATIC=new T.Group();STATIC.name='static';scene.add(STATIC);
 layoutWorld();buildSim();buildFloor();buildWater();buildMask();
 buildBanks();buildRocks();buildBridge();buildLanterns();buildWillow();buildMist();buildFireflies();
 buildPads();buildSplash();buildRain();buildFood();buildBlobs();
 sizeRefr();applyTime(S.time);updateWind(1,time);updateWillow(.016,time,true);
}
let builtA=LY.aspect,rsT=0;
function fitCamera(){
 const a=innerWidth/Math.max(1,innerHeight),H=Math.min(LY.H,LY.W/a),h=(H/2)/Math.tan(20*DEG);
 camera.aspect=a;camera.position.set(0,h,0);camera.lookAt(0,0,0);camera.near=Math.max(.5,h-4.5);camera.far=h+3;camera.updateProjectionMatrix();
 U.uCam.value.copy(camera.position);
}
function rebuild(){
 try{
  for(const c of CRE)c._n=toN(c.x,c.z);
  computeLayout();setView();builtA=LY.aspect;buildStatic();
  for(const c of CRE){if(c.mode==='held')continue;c.x=NX(c._n[0]);c.z=NZ(c._n[1]);c.arc=null;creReset(c);}
 }catch(e){console.error(e);fail('Could not rebuild the pond: '+(e&&e.message||e));}
}
function onResize(){
 renderer.setSize(innerWidth,innerHeight);fitCamera();sizeRefr();
 const a=innerWidth/Math.max(1,innerHeight);clearTimeout(rsT);
 if(Math.abs(a/builtA-1)>.1)rsT=setTimeout(rebuild,260);
}
addEventListener('resize',onResize);
addEventListener('orientationchange',()=>setTimeout(onResize,120));

/* ---------- starting population ---------- */
function populate(){
 for(const k of['kohaku','kohaku','showa','showa','butterfly','butterfly']){const p=randWater(.45,2,.6);spawnCreature(k,p[0],p[1],{});}
 const b=WORLD.bask&&WORLD.bask[0];
 if(b)spawnCreature('turtle',b.x,b.z,{perch:b,y:b.y});else{const p=randWater(.3,2,.5);spawnCreature('turtle',p[0],p[1],{});}
 const pads=PADS.filter(p=>p.r>=.13&&!p.occ).sort((a,b)=>b.r-a.r);
 const used=[];for(const p of pads){if(used.length>=2)break;if(used.some(q=>Math.hypot(q.x-p.x,q.z-p.z)<.9))continue;used.push(p);}
 for(let i=0;used.length<2&&i<pads.length;i++)if(!used.includes(pads[i]))used.push(pads[i]);
 for(const p of used)spawnCreature('frog',p.x,p.z,{perch:p});
}

/* ---------- main loop ---------- */
let lastNow=performance.now(),simAcc=0,running=true;
function frame(now){
 requestAnimationFrame(frame);if(!running)return;
 let ms=now-lastNow;lastNow=now;if(!(ms>0))ms=16.7;
 const dt=Math.min(ms/1000,.05);time+=dt;U.uTime.value=time;
 if(ms<250&&!document.hidden)adaptQuality(ms);
 try{
  updateWind(dt,time);updateLanterns(dt,time);updateWillow(dt,time);updateFireflies(dt,time);
  updateFloats(dt);updateRain(dt);updateFood(dt);updateCreatures(dt);updateSplash(dt);
  if(typeof audioUpdate==='function')audioUpdate(dt);
  simAcc+=dt;let n=0;while(simAcc>=1/60&&n<4){simStep();simAcc-=1/60;n++;}if(n>=4)simAcc=0;
  if(SIM.mode==='cpu')cpuUpload();
  blobFlush();renderPasses();
 }catch(e){running=false;console.error(e);fail('Something went wrong while drawing the pond:<br>'+(e&&e.message||e));}
}
document.addEventListener('visibilitychange',()=>{lastNow=performance.now();});

try{
 buildStatic();buildKoiMeshes();populate();
 if(typeof initUI==='function')initUI();
 if(typeof renderThumbs==='function')setTimeout(()=>{try{renderThumbs();}catch(e){console.warn('thumbnails',e);}},60);
 requestAnimationFrame(t=>{lastNow=t;requestAnimationFrame(frame);});
}catch(e){console.error(e);fail('The pond could not start: '+(e&&e.message||e));}
})();
</script>
</body>
