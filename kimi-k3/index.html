<!DOCTYPE html>
<html lang="en">

<style>
:root{--ink:#f3eee2;--muted:#b8c5bd;--glass:rgba(12,25,28,.62);--line:rgba(230,240,218,.15);--gold:#efc982}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#071216;color:var(--ink);font-family:"Nunito Sans",sans-serif}button,input{font:inherit}button{color:inherit}
#stage,#stage canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#stage canvas{touch-action:none}
.chrome{transition:opacity .35s ease,transform .35s ease}.panel{background:var(--glass);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.2);backdrop-filter:blur(18px) saturate(125%);-webkit-backdrop-filter:blur(18px) saturate(125%)}
#brand{position:fixed;left:22px;top:20px;padding:13px 18px 12px;border-radius:4px 18px 18px 18px;pointer-events:none;z-index:5}
#brand h1{font:650 25px/1.05 Fraunces,serif;letter-spacing:.01em;margin:0}#brand p{margin:6px 0 0;color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
#controls{position:fixed;right:20px;top:20px;z-index:7;border-radius:18px 4px 18px 18px;padding:7px;display:flex;gap:5px;align-items:center}
.ctrl{border:0;background:transparent;border-radius:11px;padding:9px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}.ctrl:hover{background:rgba(255,255,255,.09)}.ctrl.active{background:rgba(239,201,130,.17);color:var(--gold)}.ctrl kbd{font:10px/1 "Nunito Sans";opacity:.45;margin-left:4px}
#windDial{width:35px;height:35px;border:1px solid rgba(255,255,255,.2);border-radius:50%;position:relative;cursor:crosshair;touch-action:none;background:radial-gradient(circle,rgba(255,255,255,.07) 0 2px,transparent 3px)}
#windDial:before{content:"";position:absolute;inset:5px;border:1px dotted rgba(255,255,255,.12);border-radius:50%}#windArrow{position:absolute;left:16px;top:5px;width:3px;height:12px;border-radius:3px;background:var(--gold);transform-origin:50% 12px;transition:transform .15s}#windArrow:before{content:"";position:absolute;left:-3px;top:-2px;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:6px solid var(--gold)}
#timePanel{position:fixed;left:22px;top:110px;z-index:5;width:208px;padding:12px 15px;border-radius:15px}.time-head{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.06em}.time-head span:last-child{color:var(--gold)}
#timeSlider{width:100%;height:18px;margin:8px 0 1px;appearance:none;background:transparent;cursor:pointer}#timeSlider::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#db8b55,#6f7197,#253c70)}#timeSlider::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:#fff1ce;border:2px solid #715f52;margin-top:-5.5px;box-shadow:0 0 12px rgba(255,230,170,.4)}#timeSlider::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#db8b55,#6f7197,#253c70)}#timeSlider::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff1ce;border:2px solid #715f52}
.time-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
#counter{position:fixed;left:22px;bottom:22px;z-index:6;border-radius:14px;padding:10px 13px;display:flex;gap:10px;align-items:center;font-size:12px;pointer-events:none}#creatureCount{font-weight:700}#capCount{color:var(--muted);font-size:10px;border-left:1px solid var(--line);padding-left:10px}
#dock{position:fixed;z-index:8;bottom:18px;left:50%;transform:translateX(-50%);padding:9px;border-radius:22px;max-width:calc(100vw - 360px)}
#cards{display:flex;gap:7px}.card{width:116px;min-width:116px;position:relative;border:1px solid transparent;border-radius:15px;padding:7px 7px 8px;background:rgba(255,255,255,.035);cursor:grab;user-select:none;touch-action:none;transition:transform .2s,background .2s,border-color .2s}.card:hover{transform:translateY(-4px);background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.12)}.card.dragging{cursor:grabbing;transform:scale(.97)}
.thumb{height:64px;display:flex;align-items:center;justify-content:center;pointer-events:none}.thumb img{display:block;max-width:106px;max-height:68px;filter:drop-shadow(0 5px 5px rgba(0,0,0,.32))}.card-name{font:650 12px/1.15 Fraunces,serif;text-align:center;margin:3px 0 6px;pointer-events:none}.card-hint{font-size:8px;letter-spacing:.12em;text-align:center;color:var(--muted);text-transform:uppercase;pointer-events:none}
.export-wrap{position:relative;margin-top:5px}.export-toggle{width:100%;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.14);padding:4px 5px;font-size:9px;font-weight:700;cursor:pointer}.export-toggle:hover{background:rgba(239,201,130,.12)}.export-menu{display:none;position:absolute;bottom:calc(100% + 7px);left:-5px;right:-5px;padding:4px;border-radius:10px;background:rgba(9,20,23,.95);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:20}.export-menu.open{display:block}.export-menu button{display:block;width:100%;border:0;background:transparent;text-align:left;border-radius:6px;padding:7px 6px;font-size:10px;cursor:pointer;white-space:nowrap}.export-menu button:hover{background:rgba(255,255,255,.09)}
#toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-12px);background:rgba(9,20,23,.88);border:1px solid var(--line);border-radius:30px;padding:9px 16px;font-size:11px;opacity:0;pointer-events:none;transition:.25s;z-index:30;backdrop-filter:blur(12px)}#toast.show{opacity:1;transform:translate(-50%,0)}
#dragGhost{position:fixed;z-index:40;pointer-events:none;display:none;padding:7px 11px;border-radius:20px;background:rgba(13,29,31,.8);border:1px solid var(--line);font:600 11px Fraunces,serif;backdrop-filter:blur(10px)}
#reveal{display:none;position:fixed;right:16px;top:16px;z-index:10;border:1px solid var(--line);border-radius:20px;background:var(--glass);padding:8px 12px;font-size:11px;cursor:pointer;backdrop-filter:blur(12px)}.ui-hidden .chrome{opacity:0;pointer-events:none}.ui-hidden #dock{transform:translateX(-50%) translateY(15px)}.ui-hidden #reveal{display:block}
#loading{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#071216;transition:opacity .7s;pointer-events:none}#loading.done{opacity:0}.loading-inner{text-align:center}.loading-moon{width:40px;height:40px;border-radius:50%;margin:0 auto 16px;background:#f4e5bb;box-shadow:0 0 45px rgba(244,229,187,.28);animation:pulse 1.8s ease-in-out infinite}.loading-inner div:last-child{font:500 18px Fraunces,serif;letter-spacing:.05em}@keyframes pulse{50%{transform:scale(.88);opacity:.65}}
.feed-cursor #stage canvas{cursor:crosshair}
@media(max-width:1050px){#dock{max-width:calc(100vw - 40px);bottom:12px}#counter{bottom:154px;left:14px}.card{width:105px;min-width:105px}.thumb{height:56px}.thumb img{max-height:58px}#controls{right:14px}.ctrl{padding:8px}.ctrl kbd{display:none}}
@media(max-width:700px){#brand{left:12px;top:12px;padding:10px 13px}#brand h1{font-size:20px}#brand p{font-size:8px}#controls{top:78px;left:10px;right:10px;justify-content:center;flex-wrap:wrap;border-radius:15px;padding:5px}.ctrl{font-size:10px;padding:7px 8px}#windDial{width:30px;height:30px}#windArrow{left:13px;top:4px;transform-origin:50% 11px}#timePanel{left:12px;top:148px;width:176px;padding:9px 12px}#dock{left:8px;right:8px;bottom:8px;transform:none;max-width:none;overflow-x:auto;border-radius:17px;padding:7px;scrollbar-width:none}#dock::-webkit-scrollbar{display:none}#cards{gap:5px}.card{width:91px;min-width:91px;padding:5px}.thumb{height:47px}.thumb img{max-width:84px;max-height:49px}.card-name{font-size:10px}.card-hint{display:none}.export-toggle{font-size:8px}#counter{left:12px;bottom:139px;font-size:10px;padding:8px 10px}.ui-hidden #dock{transform:translateY(15px)}#toast{top:12px;font-size:10px;white-space:nowrap}}
@media(max-height:610px) and (min-width:701px){#dock{bottom:8px}.card{width:98px;min-width:98px}.thumb{height:43px}.thumb img{max-height:45px}.card-hint{display:none}#counter{bottom:130px}#timePanel{top:100px}}
</style>
</head>
<body>
<div id="stage"></div>
<header id="brand" class="chrome panel"><h1>Lantern Koi Pond</h1><p>A moonlit garden, alive in your hands</p></header>
<nav id="controls" class="chrome panel" aria-label="Pond controls">
<button id="rainBtn" class="ctrl" title="Toggle rain (R)">Rain <kbd>R</kbd></button>
<div id="windDial" title="Drag to set wind direction (W)" aria-label="Wind direction"><div id="windArrow"></div></div>
<button id="feedBtn" class="ctrl" title="Feed mode (F)">Feed <kbd>F</kbd></button>
<button id="lanternBtn" class="ctrl active" title="Toggle lanterns (L)">Lanterns <kbd>L</kbd></button>
<button id="clearBtn" class="ctrl" title="Clear creatures (C)">Clear pond <kbd>C</kbd></button>
<button id="soundBtn" class="ctrl" title="Synthesized garden sound (M)">Sound <kbd>M</kbd></button>
<button id="hideBtn" class="ctrl" title="Hide interface (H)">Hide UI <kbd>H</kbd></button>
</nav>
<section id="timePanel" class="chrome panel"><div class="time-head"><span>Garden hour</span><span id="hourName">Moonrise</span></div><input id="timeSlider" type="range" min="0" max="100" value="72" aria-label="Time from dusk to deep night"><div class="time-labels"><span>Dusk</span><span>Deep night</span></div></section>
<div id="counter" class="chrome panel"><span id="creatureCount">6 koi · 1 turtle · 2 frogs</span><span id="capCount">9 / 40</span></div>
<section id="dock" class="chrome panel" aria-label="Creature dock"><div id="cards"></div></section>
<div id="toast"></div><div id="dragGhost"></div><button id="reveal">Show UI · H</button>
<div id="loading"><div class="loading-inner"><div class="loading-moon"></div><div>Filling the pond…</div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('loading').innerHTML='<div style="padding:30px;text-align:center">Three.js could not be loaded.<br>Please check your connection and reload.</div>';return;}
const T=THREE, TAU=Math.PI*2, MAX_CREATURES=40, WATER_W=40, WATER_D=34;
const stage=document.getElementById('stage'), toastEl=document.getElementById('toast');
const CREATURES=[
 {id:'kohaku',name:'Kohaku Koi',kind:'koi',type:0},
 {id:'showa',name:'Showa Koi',kind:'koi',type:1},
 {id:'butterfly',name:'Butterfly Koi',kind:'koi',type:2},
 {id:'turtle',name:'Pond Turtle',kind:'turtle'},
 {id:'frog',name:'Tree Frog',kind:'frog'}
];
let seed=81723; function rnd(a=1,b){if(b===undefined){b=a;a=0;}seed=(seed*1664525+1013904223)>>>0;return a+(seed/4294967296)*(b-a);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));} function lerp(a,b,t){return a+(b-a)*t;}
function angleWrap(a){while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a;}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
let toastTimer=0;function toast(s){toastEl.textContent=s;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1900);}
function canvasTexture(canvas,repeat){const t=new T.CanvasTexture(canvas);t.anisotropy=4;if(repeat){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(repeat[0],repeat[1]);}return t;}
function radialTexture(inner,outer){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,inner);g.addColorStop(.35,inner);g.addColorStop(1,outer);x.fillStyle=g;x.fillRect(0,0,128,128);return canvasTexture(c);}
const softTexture=radialTexture('rgba(0,0,0,.8)','rgba(0,0,0,0)'), glowTexture=radialTexture('rgba(255,246,180,1)','rgba(255,220,90,0)');
function disposeObject(o,disposeMaterials){if(!o)return;o.traverse(n=>{if(n.geometry)n.geometry.dispose();if(disposeMaterials&&n.material){const ms=Array.isArray(n.material)?n.material:[n.material];ms.forEach(m=>m.dispose());}});if(o.parent)o.parent.remove(o);}
function cylinderBetween(a,b,r,mat,segments){const d=new T.Vector3().subVectors(b,a),m=new T.Mesh(new T.CylinderGeometry(r,r,d.length(),segments||7),mat);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());return m;}

// Renderer, camera and the two-layer pond (bottom refraction pass + surface pass).
const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;stage.appendChild(renderer.domElement);
const scene=new T.Scene(),bottomScene=new T.Scene();scene.background=new T.Color(0x0a1b24);bottomScene.background=new T.Color(0x102b2b);
scene.fog=new T.FogExp2(0x0a1b24,.018);bottomScene.fog=new T.FogExp2(0x102b2b,.012);
const camera=new T.OrthographicCamera(-16,16,10,-10,.1,100);camera.position.set(0,24,16);camera.lookAt(0,0,0);
const bottomTarget=new T.WebGLRenderTarget(innerWidth,innerHeight,{minFilter:T.LinearFilter,magFilter:T.LinearFilter,format:T.RGBAFormat,depthBuffer:true});
const ambient=new T.HemisphereLight(0x8da9c0,0x13211c,1.05);scene.add(ambient);
const moonLight=new T.DirectionalLight(0xa9c9ef,1.35);moonLight.position.set(-8,18,-11);moonLight.castShadow=true;moonLight.shadow.mapSize.set(1024,1024);moonLight.shadow.camera.left=-20;moonLight.shadow.camera.right=20;moonLight.shadow.camera.top=20;moonLight.shadow.camera.bottom=-20;moonLight.shadow.camera.near=1;moonLight.shadow.camera.far=55;moonLight.shadow.bias=-.0008;scene.add(moonLight);scene.add(moonLight.target);
const bottomAmbient=new T.HemisphereLight(0x70969a,0x172820,1.3);bottomScene.add(bottomAmbient);
const bottomMoon=new T.DirectionalLight(0x9dbbd0,1.1);bottomMoon.position.set(-5,14,-6);bottomScene.add(bottomMoon);

// Procedural baked pond-bed maps.
function makeBedTexture(){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');x.fillStyle='#61766a';x.fillRect(0,0,512,512);for(let i=0;i<900;i++){const px=rnd(512),py=rnd(512),r=rnd(1.2,6.5),v=rnd(0,1);x.fillStyle=v<.35?'rgba(33,58,53,.22)':v<.7?'rgba(191,180,139,.2)':'rgba(94,112,94,.32)';x.beginPath();x.ellipse(px,py,r,rnd(.5,1.5)*r,rnd(TAU),0,TAU);x.fill();}for(let i=0;i<80;i++){x.strokeStyle='rgba(210,198,153,.07)';x.lineWidth=rnd(.4,1.2);x.beginPath();const px=rnd(512),py=rnd(512);x.moveTo(px,py);x.quadraticCurveTo(px+rnd(-30,30),py+rnd(-30,30),px+rnd(-45,45),py+rnd(-45,45));x.stroke();}return canvasTexture(c,[7,6]);}
const bedMat=new T.MeshStandardMaterial({map:makeBedTexture(),color:0x789187,roughness:1});
const bed=new T.Mesh(new T.PlaneGeometry(WATER_W,WATER_D),bedMat);bed.geometry.rotateX(-Math.PI/2);bed.position.y=-2;bed.receiveShadow=true;bottomScene.add(bed);
const pebbleGeo=new T.SphereGeometry(1,7,5),pebbleMat=new T.MeshStandardMaterial({color:0xffffff,roughness:.92});
const pebbles=new T.InstancedMesh(pebbleGeo,pebbleMat,280);const dummy=new T.Object3D(),tmpColor=new T.Color();
for(let i=0;i<280;i++){dummy.position.set(rnd(-19,19),-1.93,rnd(-15,15));dummy.rotation.set(rnd(TAU),rnd(TAU),rnd(TAU));dummy.scale.set(rnd(.06,.21),rnd(.025,.08),rnd(.07,.25));dummy.updateMatrix();pebbles.setMatrixAt(i,dummy.matrix);pebbles.setColorAt(i,tmpColor.setHSL(rnd(.09,.18),rnd(.05,.18),rnd(.26,.55)));}bottomScene.add(pebbles);
const weedGeo=new T.PlaneGeometry(.11,1,1,3);weedGeo.translate(0,.5,0);const weedMat=new T.MeshStandardMaterial({color:0x355f4b,side:T.DoubleSide,roughness:.9});const weeds=new T.InstancedMesh(weedGeo,weedMat,170);
for(let i=0;i<170;i++){const cluster=Math.floor(i/5),a=rnd(TAU);dummy.position.set(rnd(-16,16)+Math.sin(cluster)*.2,-1.97,rnd(-12,12));dummy.rotation.set(rnd(-.15,.15),a,rnd(-.35,.35));dummy.scale.set(rnd(.6,1.4),rnd(.25,1.15),1);dummy.updateMatrix();weeds.setMatrixAt(i,dummy.matrix);}bottomScene.add(weeds);
function contactShadow(parent,x,z,s,y){const m=new T.Mesh(new T.CircleGeometry(1,24),new T.MeshBasicMaterial({map:softTexture,transparent:true,opacity:.42,depthWrite:false,color:0x08120e}));m.geometry.rotateX(-Math.PI/2);m.position.set(x,y===undefined?-1.91:y,z);m.scale.set(s,s,s);parent.add(m);return m;}
const rockMat=new T.MeshStandardMaterial({color:0x536a5e,roughness:.95}),mossMat=new T.MeshStandardMaterial({color:0x355b39,roughness:1});
for(let i=0;i<11;i++){const x=rnd(-14,14),z=rnd(-11,11),s=rnd(.35,1.05);const g=new T.Group();const r=new T.Mesh(new T.DodecahedronGeometry(s,1),rockMat);r.scale.set(1,rnd(.55,1.25),rnd(.75,1.25));r.rotation.set(rnd(TAU),rnd(TAU),rnd(TAU));r.castShadow=true;g.add(r);for(let j=0;j<3;j++){const m=new T.Mesh(new T.SphereGeometry(s*rnd(.18,.38),6,4),mossMat);m.position.set(rnd(-s*.5,s*.5),s*rnd(.35,.75),rnd(-s*.45,s*.45));m.scale.y=.25;g.add(m);}g.position.set(x,-1.55,z);bottomScene.add(g);contactShadow(bottomScene,x,z,s*1.25);}
const leafColors=[0x9b6538,0x785438,0xb28248,0x594c31];
for(let i=0;i<24;i++){const sh=new T.Shape();sh.moveTo(0,-.35);sh.quadraticCurveTo(.32,-.1,0,.4);sh.quadraticCurveTo(-.32,-.1,0,-.35);const l=new T.Mesh(new T.ShapeGeometry(sh,4),new T.MeshStandardMaterial({color:leafColors[i%4],side:T.DoubleSide,roughness:1}));l.geometry.rotateX(-Math.PI/2);l.position.set(rnd(-14,14),-1.87,rnd(-11,11));l.rotation.y=rnd(TAU);l.scale.setScalar(rnd(.35,.8));bottomScene.add(l);}
for(let i=0;i<7;i++){const x=rnd(-11,11),z=rnd(-9,9);const coin=new T.Mesh(new T.CylinderGeometry(.16,.16,.025,16),new T.MeshStandardMaterial({color:0x8e7040,metalness:.65,roughness:.55}));coin.position.set(x,-1.87,z);coin.rotation.y=rnd(TAU);bottomScene.add(coin);const hole=new T.Mesh(new T.BoxGeometry(.075,.012,.075),new T.MeshBasicMaterial({color:0x27372f}));hole.position.set(x,-1.85,z);bottomScene.add(hole);}
for(let i=0;i<8;i++){const sh=new T.Shape();sh.moveTo(-.25,-.16);sh.lineTo(.32,-.08);sh.lineTo(-.08,.29);sh.closePath();const shard=new T.Mesh(new T.ShapeGeometry(sh),new T.MeshStandardMaterial({color:i%2?0xd7ded1:0xaabfb7,side:T.DoubleSide,roughness:.5}));shard.geometry.rotateX(-Math.PI/2);shard.position.set(rnd(-10,10),-1.84,rnd(-9,9));shard.rotation.y=rnd(TAU);bottomScene.add(shard);}
function stoneLantern(small){const g=new T.Group(),stone=new T.MeshStandardMaterial({color:small?0x59675e:0x718079,roughness:.9});const add=(geo,y)=>{const m=new T.Mesh(geo,stone);m.position.y=y;m.castShadow=true;m.receiveShadow=true;g.add(m);return m;};add(new T.CylinderGeometry(.42,.52,.18,8),.09);add(new T.CylinderGeometry(.15,.2,.85,8),.58);add(new T.CylinderGeometry(.36,.28,.14,8),1.04);const house=add(new T.BoxGeometry(.53,.48,.53),1.34);const glow=new T.MeshStandardMaterial({color:0xe9b568,emissive:0xff9b36,emissiveIntensity:2.4,roughness:.6});const windowMat=glow;for(let s=0;s<4;s++){const w=new T.Mesh(new T.PlaneGeometry(.25,.25),windowMat);w.position.set(Math.sin(s*Math.PI/2)*.271,1.34,Math.cos(s*Math.PI/2)*.271);w.rotation.y=s*Math.PI/2;g.add(w);}add(new T.CylinderGeometry(.08,.55,.3,4),1.73).rotation.y=Math.PI/4;add(new T.SphereGeometry(.1,7,5),1.94);g.userData.glow=windowMat;return g;}
const sunken=stoneLantern(true);sunken.scale.setScalar(.55);sunken.position.set(-4.5,-1.8,3.5);sunken.rotation.z=.65;sunken.userData.glow.emissiveIntensity=0;sunken.userData.glow.color.set(0x54645d);bottomScene.add(sunken);contactShadow(bottomScene,-4.5,3.5,.8);

// Shore, moon-catching Taihu rocks, curved bridge, and three warm lanterns.

function updateKoi(dt){const mat=new T.Matrix4(),local=new T.Matrix4(),q=new T.Quaternion(),scale=new T.Vector3(),pos=new T.Vector3();for(let i=koi.length-1;i>=0;i--){const k=koi[i];k.startle=Math.max(0,k.startle-dt);k.mouth=Math.max(0,k.mouth-dt*2.3);let target=k.target,feeding=null,best=2.2;if(foods.length){foods.forEach(f=>{const d=Math.hypot(f.x-k.pos.x,f.z-k.pos.z);if(d<best||(!feeding&&d<6)){best=d;feeding=f;}});}if(feeding){target=new T.Vector3(feeding.x,0,feeding.z);if(best<.38){const idx=foods.indexOf(feeding);if(idx>=0)foods.splice(idx,1);k.mouth=1;addDropWorld(k.pos.x,k.pos.z,.13,.009);spawnRing(k.pos,.65,.22,.65);if(audio.enabled)audio.gulp();feeding=null;}}else if(elapsed>k.nextTarget||k.pos.distanceTo(target)<.6){k.target.set(rnd(-7,7),0,rnd(-5,5));k.nextTarget=elapsed+rnd(4,9);}target=feeding?target:k.target;const desired=Math.atan2(target.x-k.pos.x,target.z-k.pos.z),diff=angleWrap(desired-k.angle);k.turn=lerp(k.turn,clamp(diff*1.8,-1,1),dt*4);k.angle+=clamp(diff,-1,1)*dt*(k.startle?5:1.6);const speed=(feeding?1.2:.65)*(k.startle?2.7:1);k.speed=lerp(k.speed,speed,dt*2);const fx=Math.sin(k.angle),fz=Math.cos(k.angle);k.vx=lerp(k.vx,fx*k.speed,dt*(k.startle?1.2:3));k.vz=lerp(k.vz,fz*k.speed,dt*(k.startle?1.2:3));k.pos.x+=k.vx*dt;k.pos.z+=k.vz*dt;const bound=(k.pos.x/9.5)**2+(k.pos.z/6.8)**2;if(bound>1){k.target.set(0,0,0);k.pos.x*=.998;k.pos.z*=.998;}k.pos.y=.11;if(k.jumpT>0){k.jumpT+=dt/1.35;if(k.jumpT>=1){k.jumpT=0;k.nextJump=elapsed+rnd(24,60);splash(k.pos,1);startleAt(k.pos,1.5);}else{k.pos.y+=Math.sin(k.jumpT*Math.PI)*1.35;}}else if(elapsed>k.nextJump&&koi.length<25){k.jumpT=.001;addDropWorld(k.pos.x,k.pos.z,.18,.012);}k.wake-=dt;if(k.wake<=0&&Math.hypot(k.vx,k.vz)>.65&&k.jumpT===0){k.wake=rnd(.22,.4);spawnRing(k.pos,.7,.12,.8,0x8dbcbd);if(Math.random()<.35)addDropWorld(k.pos.x,k.pos.z,.035,.007);}const pitch=k.jumpT>0?Math.cos(k.jumpT*Math.PI)*-.55:0;q.setFromEuler(new T.Euler(pitch,k.angle,0,'YXZ'));scale.setScalar(k.scale);mat.compose(k.pos,q,sc function updateTurtles(dt){turtles.forEach(t=>{t.retract=Math.max(0,t.retract-dt);const parts=t.model.userData;parts.head.scale.setScalar(1-clamp(t.retract,0,1)*.65);parts.head.position.z=parts.head.userData.baseZ-clamp(t.retract,0,1)*.22;parts.legs.forEach((l,i)=>l.rotation.x=Math.sin(elapsed*3+t.phase+i*Math.PI)*.45*(t.mode==='swim'?1:0));if(t.mode==='swim'){if(elapsed>t.timer){const useRock=Math.random()<.5&&baskRocks.length;if(useRock){const r=baskRocks[Math.floor(rnd(baskRocks.length))];t.bask={kind:'rock',data:r};t.target=new T.Vector3(r.x,r.y,r.z);}else{const p=pads[Math.floor(rnd(pads.length))];t.bask={kind:'pad',data:p};t.target=new T.Vector3(p.mesh.position.x,.25,p.mesh.position.z);}t.mode='approach';}else{t.angle+=Math.sin(elapsed*.3+t.phase)*dt*.25;t.pos.x+=Math.sin(t.angle)*dt*.24;t.pos.z+=Math.cos(t.angle)*dt*.24;}}else if(t.mode==='approach'){if(t.bask.kind==='pad')t.target.set(t.bask.data.mesh.position.x,.25,t.bask.data.mesh.position.z);const d=new T.Vector3().subVectors(t.target,t.pos);if(d.length()<.18){t.mode='bask';t.timer=elapsed+rnd(7,14);t.pos.copy(t.target);}else{d.normalize();t.pos.addScaledVector(d,dt*.35);t.angle=Math.atan2(d.x,d.z);}}else if(t.mode==='bask'){if(t.bask.kind==='pad'){t.pos.x=t.bask.data.mesh.position.x;t.pos.z=t.bask.data.mesh.position.z;t.pos.y=.25;}if(elapsed>t.timer){t.mode='slide';t.timer=0;}}else if(t.mode==='slide'){t.pos.y-=dt*.7;t.pos.x+=Math.sin(t.angle)*dt*.5;t.pos.z+=Math.cos(t.angle)*dt*.5;if(t.pos.y<=.12){t.pos.y=.12;t.mode='swim';t.timer=elapsed+rnd(18,35);splash(t.pos,.65);}}t.model.position.copy(t.pos);t.model.rotation.y=t.angle;});}
function updateFrogs(dt){frogs.forEach(f=>{const parts=f.model.userData;parts.throat.scale.set(.19*(1+Math.sin(elapsed*4+f.phase)*.16),.11*(1+Math.sin(elapsed*4+f.phase)*.3),.16);if(f.hopT>0){f.hopT+=dt/1.05;const t=Math.min(1,f.hopT);f.pos.lerpVectors(f.from,f.to,t);f.pos.y=.2+Math.sin(t*Math.PI)*1.25;const d=new T.Vector3().subVectors(f.to,f.from);f.angle=Math.atan2(d.x,d.z);parts.legs.forEach((l,i)=>l.rotation.x=Math.sin(t*Math.PI)*(i%2?.8:-.8));if(f.hopT>=1){f.hopT=0;f.pos.copy(f.to);const p=pads[f.padIndex];p.rock+=.45;splash(f.pos,.45);}}else{const p=pads[f.padIndex];if(p){f.pos.x=p.mesh.position.x;f.pos.z=p.mesh.position.z;f.pos.y=.2;}if(elapsed>f.nextHop)beginFrogHop(f,false);}f.model.position.copy(f.pos);f.model.rotation.y=f.angle;if(f.tongueT>0){f.tongueT+=dt/.75;const ff=fireflies[f.tongueTarget];if(ff&&ff.active){const start=f.pos.clone().add(new T.Vector3(Math.sin(f.angle)*.35,.35,Math.cos(f.angle)*.35)),amount=Math.sin(Math.min(1,f.tongueT)*Math.PI);const end=start.clone().lerp(ff.pos,amount);setTongue(start,end);tongue.visible=true;if(f.tongueT>.45&&ff.active){ff.active=false;ff.respawn=elapsed+5;if(audio.enabled)audio.gulp();}}if(f.tongueT>=1){f.tongueT=0;tongue.visible=false;f.nextTongue=elapsed+rnd(6,14);}}else if(elapsed>f.nextTongue){let best=-1,bd=16;fireflies.forEach((ff,i)=>{if(!ff.active)return;const d=ff.pos.distanceTo(f.pos);if(d<bd){bd=d;best=i;}});if(best>=0){f.tongueTarget=best;f.tongueT=.001;}else f.nextTongue=elapsed+3;}});if(!frogs.some(f=>f.tongueT>0))tongue.visible=false;}
function updatePads(dt){pads.forEach(p=>{p.vx+=wind.x*dt*.008+Math.sin(elapsed*.4+p.homeX)*dt*.002;p.vz+=wind.y*dt*.008;p.vx+=(p.homeX-p.mesh.position.x)*dt*.012;p.vz+=(p.homeZ-p.mesh.position.z)*dt*.012;p.vx*=Math.pow(.94,dt*60);p.vz*=Math.pow(.94,dt*60);p.mesh.position.x+=p.vx*dt;p.mesh.position.z+=p.vz*dt;p.rock*=Math.pow(.93,dt*60);p.rockX=Math.sin(elapsed*2+p.homeX)*.025*windStrength+p.rock*Math.sin(elapsed*8);p.rockZ=Math.cos(elapsed*1.7+p.homeZ)*.025*windStrength+p.rock*Math.cos(elapsed*7);p.mesh.rotation.x=p.rockX;p.mesh.rotation.z=p.rockZ;p.mesh.rotation.y+=dt*.015;});for(let i=0;i<pads.length;i++)for(let j=i+1;j<pads.length;j++){const a=pads[i],b=pads[j],dx=b.mesh.position.x-a.mesh.position.x,dz=b.mesh.position.z-a.mesh.position.z,d=Math.hypot(dx,dz),min=(a.radius+b.radius)*.83;if(d<min&&d>.001){const push=(min-d)*.5,nx=dx/d,nz=dz/d;a.mesh.position.x-=nx*push;a.mesh.position.z-=nz*push;b.mesh.position.x+=nx*push;b.mesh.position.z+=nz*push;const av=a.vx*nx+a.vz*nz,bv=b.vx*nx+b.vz*nz;a.vx+=(bv-av)*nx*.5;a.vz+=(bv-av)*nz*.5;b.vx+=(av-bv)*nx*.5;b.vz+=(av-bv)*nz*.5;a.rock+=.03;b.rock+=.03;}}}

function updateFireflies(){fireflies.forEach((f,i)=>{if(!f.active){fireflyPos[i*3+1]=-100;if(elapsed>f.respawn){f.active=true;f.base.set(rnd(-11,11),rnd(.4,2.4),rnd(-8,8));}return;}f.pos.set(f.base.x+Math.sin(elapsed*.7+f.phase)*.8,f.base.y+Math.sin(elapsed*1.3+f.phase)*.35,f.base.z+Math.cos(elapsed*.6+f.phase)*.75);fireflyPos[i*3]=f.pos.x;fireflyPos[i*3+1]=f.pos.y;fireflyPos[i*3+2]=f.pos.z;const glow=(.35+.65*Math.pow(.5+.5*Math.sin(elapsed*3+f.phase),2))*(.35+.65*timeMix);fireflyCol[i*3]=glow;fireflyCol[i*3+1]=glow*.82;fireflyCol[i*3+2]=glow*.25;});fireflyGeo.attributes.position.needsUpdate=true;fireflyGeo.attributes.color.needsUpdate=true;}
let rainHits=0;function updateRain(dt){rainLines.visible=rain;if(!rain){rainHits=0;return;}const count=[150,260,400][quality];rainGeo.setDrawRange(0,count*2);for(let i=0;i<count;i++){const d=rainData[i];d.y-=d.speed*dt;d.x+=wind.x*dt*.7;d.z+=wind.y*dt*.7;if(d.y<0){d.y=rnd(7,12);d.x=rnd(-19,19);d.z=rnd(-14,14);rainHits++;if(i%3===0)addDropWorld(d.x,d.z,.045,.005);if(i%31===0)spawnRing(new T.Vector3(d.x,0,d.z),.25,.16,.45);}rainPos[i*6]=d.x;rainPos[i*6+1]=d.y;rainPos[i*6+2]=d.z;rainPos[i*6+3]=d.x-wind.x*.04;rainPos[i*6+4]=d.y+.38;rainPos[i*6+5]=d.z-wind.y*.04;}rainGeo.attributes.position.needsUpdate=true;}

function updateFood(dt){for(let i=foods.length-1;i>=0;i--){const f=foods[i];f.age+=dt;f.x+=wind.x*dt*.012;f.z+=wind.y*dt*.012;if(f.age>65)foods.splice(i,1);}for(let i=0;i<foods.length;i++){const f=foods[i];dummy.position.set(f.x,.08+Math.sin(elapsed*2+f.phase)*.018,f.z);dummy.scale.setScalar(1);dummy.rotation.set(0,0,0);dummy.updateMatrix();foodInst.setMatrixAt(i,dummy.matrix);}foodInst.count=foods.length;foodInst.instanceMatrix.needsUpdate=true;}
function updateTime(v){timeMix=v;const dusk=new T.Color(0x6b493c),night=new T.Color(0x071426),bg=dusk.clone().lerp(night,v);scene.background.copy(bg);scene.fog.color.copy(bg);scene.fog.density=.009+.017*v;bottomScene.background.copy(new T.Color(0x38544b).lerp(new T.Color(0x0b2329),v));bottomScene.fog.color.copy(bottomScene.background);ambient.color.copy(new T.Color(0xf1ae78).lerp(new T.Color(0x8ba9ce),v));ambient.intensity=1.25-.35*v;moonLight.color.copy(new T.Color(0xffc18c).lerp(new T.Color(0xa9c9ef),v));moonLight.intensity=.75+.75*v;bottomMoon.color.copy(moonLight.color);bottomAmbient.intensity=1.45-.45*v;waterMat.uniforms.uTimeMix.value=v;waterMat.uniforms.uShallow.value.copy(new T.Color(0x286257).lerp(new T.Color(0x103f43),v));waterMat.uniforms.uDeep.value.copy(new T.Color(0x172637).lerp(new T.Color(0x040b20),v));waterMat.uniforms.uFogColor.value.copy(bg);document.getElementById('hourName').textContent=v<.25?'Dusk':v<.6?'Blue hour':v<.85?'Moonrise':'Deep night';}

const auxRenderer=new T.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});auxRenderer.setPixelRatio(1);auxRenderer.outputEncoding=T.sRGBEncoding;auxRenderer.toneMapping=T.ACESFilmicToneMapping;auxRenderer.setClearColor(0x000000,0);
function auxSceneWith(model){const s=new T.Scene();s.add(model);s.add(new T.HemisphereLight(0xe4eddf,0x263c38,1.65));const d=new T.DirectionalLight(0xfff0d5,2.1);d.position.set(-3,6,4);s.add(d);const fill=new T.DirectionalLight(0x8fb8d4,1);fill.position.set(4,2,-3);s.add(fill);return s;}
function normalizedModel(kind){const m=buildCreatureModel(kind),box=new T.Box3().setFromObject(m),size=box.getSize(new T.Vector3()),max=Math.max(size.x,size.y,size.z);m.scale.multiplyScalar(2.2/max);return m;}
function renderThumbnails(){CREATURES.forEach(c=>{const model=normalizedModel(c.id),s=auxSceneWith(model),cam=new T.PerspectiveCamera(32,1.55,.1,100);cam.position.set(3.1,2.3,4.1);cam.lookAt(0,0,0);if(c.kind==='frog')cam.position.set(2.7,2.7,3.8);auxRenderer.setSize(186,120);auxRenderer.render(s,cam);const img=document.getElementById('thumb-'+c.id);if(img)img.src=auxRenderer.domElement.toDataURL('image/png');});}
function exportGLB(kind,name){if(!T.GLTFExporter){toast('GLTFExporter is still loading');return;}const model=buildCreatureModel(kind);model.name=name;model.updateMatrixWorld(true);let triangles=0;model.traverse(n=>{if(n.isMesh)triangles+=(n.geometry.index?n.geometry.index.count:n.geometry.attributes.position.count)/3;});if(triangles>=5000){toast('Model exceeds the 5,000 triangle budget');return;}model.traverse(n=>{n.userData={};});const exporter=new T.GLTFExporter();try{exporter.parse(model,result=>{download(new Blob([result],{type:'model/gltf-binary'}),name+'.glb');disposeObject(model,true);toast(`${name} · ${Math.round(triangles)} triangles · GLB exported`);},{binary:true,onlyVisible:true});}catch(err){console.error(err);toast('GLB export failed · see console');}}
function poseModel(model,kind,t){const p=model.userData;if(CREATURES.find(c=>c.id===kind).kind==='koi'){const a=p.body.geometry.attributes.position,base=p.body.userData.base;for(let i=0;i<a.count;i++){const z=base[i*3+2],tail=1-clamp((z+1)*.5,0,1);a.setX(i,base[i*3]+Math.sin(z*4.8-t*TAU)*(.025+.13*tail));}a.needsUpdate=true;p.body.geometry.computeVertexNormals();p.tail.rotation.y=Math.sin(t*TAU)*.32;p.fins.rotation.z=Math.sin(t*TAU+1)*.15;}else if(kind==='turtle'){p.legs.forEach((l,i)=>l.rotation.x=Math.sin(t*TAU+i*Math.PI)*.55);p.head.position.z=p.head.userData.baseZ+Math.sin(t*TAU)*.025;}else{p.throat.scale.y=.11*(1+.3*Math.sin(t*TAU));p.legs.forEach((l,i)=>l.rotation.x=Math.sin(t*TAU+i)*.35);}}
function exportSprite(kind,name){toast(`Rendering ${name} · 8 top-down frames…`);setTimeout(()=>{const model=normalizedModel(kind),s=auxSceneWith(model),box=new T.Box3().setFromObject(model),sz=box.getSize(new T.Vector3()),half=Math.max(sz.x,sz.z)*.68+.15;const cam=new T.OrthographicCamera(-half,half,half,-half,.1,50);cam.position.set(0,10,0);cam.up.set(0,0,1);cam.lookAt(0,0,0);auxRenderer.setSize(256,256);const sheet=document.createElement('canvas');sheet.width=2048;sheet.height=256;const ctx=sheet.getContext('2d');for(let i=0;i<8;i++){poseModel(model,kind,i/8);auxRenderer.render(s,cam);ctx.drawImage(auxRenderer.domElement,i*256,0,256,256);}sheet.toBlob(blob=>{if(blob){download(blob,name+'_swim_8f.png');toast(`${name} · 2048 × 256 sprite sheet downloaded`);}else toast('Sprite export failed');disposeObject(model,true);},'image/png');},60);}
function buildCards(){const host=document.getElementById('cards');CREATURES.forEach(c=>{const card=document.createElement('article');card.className='card';card.dataset.kind=c.id;card.innerHTML=`<div class="thumb"><img id="thumb-${c.id}" alt="${c.name} 3D thumbnail"></div><div class="card-name">${c.name}</div><div class="card-hint">Click to toss · drag to place</div><div class="export-wrap"><button class="export-toggle" aria-label="Export ${c.name}">Export ▾</button><div class="export-menu"><button data-export="glb" data-kind="${c.id}">.glb <span style="opacity:.45">3D model</span></button><button data-export="sprite" data-kind="${c.id}">Sprite sheet <span style="opacity:.45">8 × PNG</span></button></div></div>`;host.appendChild(card);card.addEventListener('pointerdown',e=>{if(e.target.closest('.export-wrap'))return;e.preventDefault();if(totalCreatures()+flights.length>=MAX_CREATURES){toast('The pond is full · 40 creature limit');return;}dragInfo={kind:c.id,name:c.name,card,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,dragged:false,point:null};card.classList.add('dragging');});});}

function toggleFeed(){feedMode=!feedMode;document.getElementById('feedBtn').classList.toggle('active',feedMode);document.body.classList.toggle('feed-cursor',feedMode);toast(feedMode?'Feed mode · click the water':'Feed mode off');}
function toggleLanterns(){lanternsOn=!lanternsOn;document.getElementById('lanternBtn').classList.toggle('active',lanternsOn);updateLanterns();toast(lanternsOn?'Lanterns lit':'Lanterns dark');}
function clearPond(){koi.length=0;foods.length=0;turtles.forEach(t=>disposeObject(t.model,false));frogs.forEach(f=>disposeObject(f.model,false));flights.forEach(f=>disposeObject(f.model,false));turtles.length=frogs.length=flights.length=0;removePreview();resetSimulation();updateCounter();toast('Pond cleared · ripples settling');}
function toggleUI(){document.body.classList.toggle('ui-hidden');}
document.getElementById('rainBtn').onclick=toggleRain;document.getElementById('feedBtn').onclick=toggleFeed;document.getElementById('lanternBtn').onclick=toggleLanterns;document.getElementById('clearBtn').onclick=clearPond;document.getElementById('soundBtn').onclick=()=>audio.toggle();document.getElementById('hideBtn').onclick=toggleUI;document.getElementById('reveal').onclick=toggleUI;
document.getElementById('timeSlider').addEventListener('input',e=>updateTime(e.target.value/100));
let windDrag=false;const windDial=document.getElementById('windDial');function windFromEvent(e){const r=windDial.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);setWind(Math.atan2(dy,dx),clamp(Math.hypot(dx,dy)/(r.width*.5),.2,1.4));}
windDial.addEventListener('pointerdown',e=>{e.preventDefault();windDrag=true;windDial.setPointerCapture(e.pointerId);windFromEvent(e);});windDial.addEventListener('pointermove',e=>{if(windDrag)windFromEvent(e);});windDial.addEventListener('pointerup',()=>windDrag=false);
document.addEventListener('click',e=>{const toggle=e.target.closest('.export-toggle');if(toggle){e.stopPropagation();const menu=toggle.nextElementSibling,open=menu.classList.contains('open');document.querySelectorAll('.export-menu').forEach(m=>m.classList.remove('open'));menu.classList.toggle('open',!open);return;}const btn=e.target.closest('[data-export]');if(btn){e.stopPropagation();const c=CREATURES.find(x=>x.id===btn.dataset.kind);btn.closest('.export-menu').classList.remove('open');if(btn.dataset.export==='glb')exportGLB(c.id,c.name);else exportSprite(c.id,c.name);return;}if(!e.target.closest('.export-wrap'))document.querySelectorAll('.export-menu').forEach(m=>m.classList.remove('open'));});
window.addEventListener('pointermove',e=>{if(!dragInfo)return;dragInfo.x=e.clientX;dragInfo.y=e.clientY;if(!dragInfo.dragged&&Math.hypot(e.clientX-dragInfo.startX,e.clientY-dragInfo.startY)>7){dragInfo.dragged=true;dragPreview=buildCreatureModel(dragInfo.kind);dragPreview.scale.setScalar(dragInfo.kind==='frog'?.82:dragInfo.kind==='turtle'?.72:.78);scene.add(dragPreview);document.getElementById('dragGhost').textContent=dragInfo.name;document.getElementById('dragGhost').style.display='block';}if(dragInfo.dragged){const p=pointerToPond(e.clientX,e.clientY);if(p){dragInfo.point=p;dragPreview.position.copy(p);dragPreview.position.y=1+Math.sin(elapsed*4)*.12;dragPreview.rotation.y+=.035;placeRing.position.set(p.x,.08,p.z);placeRing.visible=true;}const ghost=document.getElementById('dragGhost');ghost.style.left=(e.clientX+14)+'px';ghost.style.top=(e.clientY+14)+'px';}});
window.addEventListener('pointerup',e=>{if(!dragInfo)return;const d=dragInfo;dragInfo=null;d.card.classList.remove('dragging');if(d.dragged){const p=d.point||pointerToPond(e.clientX,e.clientY);removePreview();if(p)spawnCreature(d.kind,p,p.clone().add(new T.Vector3(0,1,0)));}else{const target=randomTarget();spawnCreature(d.kind,target);}});
renderer.domElement.addEventListener('pointerdown',e=>{if(e.button!==0)return;const p=pointerToPond(e.clientX,e.clientY);if(!p)return;if(feedMode)spawnFood(p);else{splash(p,.35);startleAt(p,2.4);}});
window.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();if(k==='r')toggleRain();else if(k==='w')setWind(windAngle+Math.PI/4,.85);else if(k==='f')toggleFeed();else if(k==='l')toggleLanterns();else if(k==='c')clearPond();else if(k==='m')audio.toggle();else if(k==='h')toggleUI();else return;e.preventDefault();});

// Resize, adaptive quality and main render loop.
function onResize(){const aspect=innerWidth/innerHeight;let h=20,w=h*aspect;if(w<24){w=24;h=w/aspect;}camera.left=-w/2;camera.right=w/2;camera.top=h/2;camera.bottom=-h/2;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);const size=renderer.getDrawingBufferSize(new T.Vector2());bottomTarget.setSize(size.x,size.y);waterMat.uniforms.uResolution.value.copy(size);}
function applyQuality(){const ratios=[.75,1,Math.min(1.5,devicePixelRatio||1)];renderer.setPixelRatio(ratios[quality]);onResize();}
window.addEventListener('resize',onResize);
let last=performance.now(),fpsTime=0,fpsFrames=0,qualityCooldown=0;
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.033,(now-last)/1000||.016);last=now;elapsed+=dt;fpsTime+=dt;fpsFrames++;qualityCooldown-=dt;if(fpsTime>3){const fps=fpsFrames/fpsTime;if(qualityCooldown<=0){if(fps<42&&quality>0){quality--;applyQuality();qualityCooldown=8;}else if(fps>57&&quality<2){quality++;applyQuality();qualityCooldown=10;}}fpsTime=0;fpsFrames=0;}
updateFlights(dt);updateKoi(dt);updateTurtles(dt);updateFrogs(dt);updatePads(dt);updateWillow();updateFireflies();updateRain(dt);updateParticles(dt);updateFood(dt);updateLanterns();audio.update(elapsed,rainHits);rainHits=0;
waterMat.uniforms.uTime.value=elapsed;bodyMatKoi.uniforms.uTime.value=elapsed;finMatKoi.uniforms.uTime.value=elapsed;simulateWater();renderer.setRenderTarget(bottomTarget);renderer.render(bottomScene,camera);renderer.setRenderTarget(null);renderer.render(scene,camera);}

// Initial population: 6 koi, 1 turtle and 2 frogs.
buildCards();setWind(windAngle,windStrength);updateTime(.72);resetSimulation();applyQuality();
['kohaku','showa','butterfly','kohaku','showa','butterfly'].forEach((kind,i)=>addKoi(kind,-5+i*1.8,Math.sin(i*1.7)*2.5));
addTurtle(buildCreatureModel('turtle'),2.8,1.2);addFrog(buildCreatureModel('frog'),pads[1].mesh.position.x,pads[1].mesh.position.z,true);addFrog(buildCreatureModel('frog'),pads[7].mesh.position.x,pads[7].mesh.position.z,true);updateCounter();
renderThumbnails();requestAnimationFrame(animate);setTimeout(()=>{document.getElementById('loading').classList.add('done');setTimeout(()=>document.getElementById('loading').remove(),800);},350);
})();
</script>
